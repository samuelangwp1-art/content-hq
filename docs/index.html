<title>Content HQ</title><style>
:root{--bg:#0c0e0d;--pan:#141816;--pan2:#1a201d;--ln:#242b27;--ink:#eef3f0;
--mut:#87938c;--acc:#3ddc84;--amb:#ffb454;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
.side{width:206px;flex-shrink:0;background:var(--pan);border-right:1px solid var(--ln);
padding:16px 11px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:18px;padding:0 5px}
.dot{width:25px;height:25px;border-radius:8px;background:var(--acc);flex-shrink:0}
.brand b{font-size:15px}
.navlab{color:var(--mut);font-size:10px;text-transform:uppercase;
letter-spacing:.11em;margin:15px 6px 6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:6px;
padding:9px 11px;border-radius:9px;color:var(--mut);cursor:pointer;
font-size:13.5px;margin-bottom:2px;user-select:none;border:0;width:100%;
background:none;font-family:inherit;text-align:left}
.nav:hover{background:var(--pan2);color:var(--ink)}
.nav.on{background:var(--acc);color:#08120c;font-weight:600}
.nav.sub{font-size:12.5px;padding-left:20px}
.nav .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.main{flex:1;padding:18px 20px;min-width:0}

margin-bottom:16px;flex-wrap:wrap}

.cols{display:grid;grid-template-columns:1fr 290px;gap:15px;align-items:start}

margin-bottom:15px}

.t{overflow-wrap:anywhere} .num{text-align:right;white-space:nowrap}

.apbtn.n.on{background:#3d1c17;color:#ffb3a5;border-color:#80392f}
.apbtn:active{transform:translateY(1px)}
.apnote{font-size:10px;color:var(--mut)}
/* ask box */
.askwrap{position:sticky;bottom:0;margin-top:18px;padding:12px 0 16px;
background:linear-gradient(180deg,transparent,var(--bg) 22%)}

border:1px solid var(--ln);outline:none}

cursor:pointer;background:#173d29;color:#8ff0b5;border:1px solid #2f8055}
.askbtn:active{transform:translateY(1px)}

.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.when{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;
width:62px;flex-shrink:0}
.what{font-size:12.5px;min-width:0;overflow-wrap:anywhere}
svg.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.back{background:none;border:0;color:var(--acc);cursor:pointer;font-size:12.5px;
padding:0;margin-bottom:10px;font-family:inherit}
details.draft{border-bottom:1px solid var(--ln);padding:8px 0}
details.draft:last-child{border-bottom:0}
details.draft summary{cursor:pointer;font-size:12.5px;list-style:none;
display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.draft summary::-webkit-details-marker{display:none}
details.draft summary:before{content:'\25B8';color:var(--mut);font-size:10px}
details.draft[open] summary:before{content:'\25BE'}
details.draft pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;
background:var(--pan2);border:1px solid var(--ln);border-radius:9px;
padding:11px;margin:6px 0 10px;line-height:1.6;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
details.draft summary .when{width:auto;flex-shrink:0}
details.draft summary .what{font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.foot{color:var(--mut);font-size:11px;margin-top:22px;line-height:1.7}
.stack{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:880px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:5px;
 padding:11px;border-right:0;border-bottom:1px solid var(--ln)}
 .brand{width:100%;margin-bottom:6px} .navlab{display:none}
 .nav{flex:1;justify-content:center;margin:0;min-width:104px}
 .nav.sub{padding-left:11px}
 .cols{grid-template-columns:1fr} .main{padding:14px 13px}
}

Luggage","channel":"qc","images":124,"vo_chars":3119,"sfx_secs":32,"img_cost":18.6,"vo_cost":0.31,"sfx_cost":0.06,"anim_cost":0.0,"total":18.98,"minutes":3.5},{"episode":"Tunnel Worker","channel":"dt","images":62,"vo_chars":3571,"sfx_secs":40,"img_cost":9.3,"vo_cost":0.36,"sfx_cost":0.08,"anim_cost":0.0,"total":9.74,"minutes":3.5}],"cost_total":77.48,"queue":{"posted":8,"pending":48,"days":24,"items":[{"title":"You stand at the belt until it stops moving","fmt":"crop","ch":"qc"},{"title":"You stand at the belt until it stops moving...","fmt":"full","ch":"qc"},{"title":"Every one of those stops the machine","fmt":"crop","ch":"dt"},{"title":"Every one of those stops the machine...","fmt":"full","ch":"dt"},{"title":"If your bag is scanned anywhere, the system matches it to","fmt":"crop","ch":"qc"},{"title":"If your bag is scanned anywhere, the system matches it to...","fmt":"full","ch":"qc"},{"title":"Nobody will tell you they believe in it","fmt":"crop","ch":"dt"},{"title":"Nobody will tell you they believe in it...","fmt":"full","ch":"dt"},{"title":"Once the airline pays you, the bag stops being yours","fmt":"crop","ch":"qc"},{"title":"Once the airline pays you, the bag stops being yours...","fmt":"full","ch":"qc"},{"title":"You go to work by going down","fmt":"crop","ch":"dt"},{"title":"You go to work by going down...","fmt":"full","ch":"dt"},{"title":"None of these were stolen","fmt":"crop","ch":"qc"},{"title":"None of these were stolen...","fmt":"full","ch":"qc"},{"title":"The machine you work on is called a tunnel boring machine","fmt":"crop","ch":"dt"},{"title":"The machine you work on is called a tunnel boring machine...","fmt":"full","ch":"dt"},{"title":"A town called Scottsboro, in Alabama, population about fifteen thousand","fmt":"crop","ch":"qc"},{"title":"A town called Scottsboro, in Alabama, population about fifteen thousand...","fmt":"full","ch":"qc"},{"title":"You do not watch it work","fmt":"crop","ch":"dt"},{"title":"You do not watch it work...","fmt":"full","ch":"dt"}]},"social":{"carousels":[{"date":"2026-09-04","day":"Fri","slug":"plans a to g","raw_slug":"plans-a-to-g","body":"I sell signage for a living, and 7 things have to be settled before ABCi ever sees your application.\n\n\"I just need a sign made, how hard can it be?\"\n\nBefore an ABCi submission can even go in, 7 things have to be settled. Not roughly decided. Settled.\n\nSite plan. Where exactly it fixes on the building. The proposed wording. Lettering size. Materials, mounting, colour and height. The proposed Jawi wording. Your logo, plus its written definition.\n\nMost of that list is quick. The site plan and fixture point get sorted in one site visit. Materials, mounting, colour and height is a conversation you are already having.\n\nThe 2 that catch people out are the Jawi wording and the logo definition.\n\nNobody walks in already knowing either answer. Jawi wording needs translating properly, not run through an app. A logo needs a written definition of what it is, not just the file on your invoices.\n\nThose 2 sit outside what a shop owner has usually thought about. They stall a submission longest.\n\nIf you are starting a signage job, write those 2 down first. Get the Jawi translation moving and the logo definition written out before you even call a vendor.\n\nAsk which of the 7 plans your vendor has already started, before you pay a deposit.\n\n#Signage #BruneiBusiness #SmallBusiness #Retail","ig":"SLIDE 1: 7 things you need decided before an ABCi submission can go in\nNOTE: Dark cover slide, bold white text, numbered list icon.\n\nSLIDE 2: Site plan\nNOTE: Beige background, small site plan/blueprint icon, plain centred text.\n\nSLIDE 3: Place of fixture, wording, lettering size\nNOTE: Beige background, three small icons in a row: wall, text, ruler.\n\nSLIDE 4: Materials, mounting, colour, height\nNOTE: Beige background, small icon row: material swatch, bracket, paint drop, ruler.\n\nSLIDE 5: Proposed Jawi wording\nNOTE: Warm orange background, bold text, no icon, this is the flag slide.\n\nSLIDE 6: Logo, plus its written definition\nNOTE: Warm orange background, bold text, logo icon with a small document icon beside it.\n\nSLIDE 7: These two are the ones nobody has ready on day one\nNOTE: Light background, plain bold centred text.\n\nSLIDE 8: Get the Jawi wording moving and the logo definition written before you call a vendor\nNOTE: Dark closer slide, bold white text.\n\nCAPTION: An ABCi submission needs seven things decided before it can even go in: site plan, place of fixture, proposed wording, lettering size, materials and mounting and colour and height, proposed Jawi wording, and your logo plus its written definition. Most of that sorts itself out in one conversation with your fabricator. The two that catch people out are the Jawi wording and the logo definition. Nobody decides they want a shopfront sign and already has a proper Jawi translation ready, or a written definition of their own logo. Those sit outside what a shop owner has usually thought about at the point they want a sign made. If you're starting a signage job, get those two moving first, before you even call a vendor.","cards":0},{"date":"2026-09-05","day":"Sat","slug":"three queues not one","raw_slug":"three-queues-not-one","body":"I quote signage for a living, and every job runs on 3 separate clocks that clients only ever hear as one.\n\n\"So how long does the whole thing take?\"\n\nJawi translation is roughly a week. ABCi approval is 2 to 3 weeks. Fabrication is 1 to 3 weeks. Three different people, three different speeds.\n\nI am not going to add them up for you. The moment you treat them as one number you have already misjudged the job.\n\nA client can watch fabrication. Material arrives, gets cut, gets assembled. So that is the queue they budget time for.\n\nTranslation sits with a translator. Approval sits with ABCi. Neither has anything to look at, so in most people's heads they take zero days.\n\nThe queue that quietly decides your opening date is usually the one nobody was watching.\n\nNone of the 3 is difficult on its own. The problem is planning around one queue and assuming the other two happen on their own.\n\nStart the Jawi wording early, because nothing can be submitted until it is right.\n\nThen ask for the Jawi wording date before you agree any opening date. It is the only queue you can begin early, and it is the one people start last.\n\n#Signage #BruneiBusiness #SmallBusiness #ProjectPlanning","ig":"SLIDE 1: Your signboard has three clocks. You're only watching one.\nNOTE: Dark background, cover slide. Bold white text, centered. Small clock or queue icon motif, no literal photo.\n\nSLIDE 2: Jawi translation. About a week.\nNOTE: Warm beige background. Large number \"1 week\" as the visual anchor, small label text underneath.\n\nSLIDE 3: ABCi approval. Two to three weeks.\nNOTE: Warm beige background, same layout style as slide 2 for consistency. \"2-3 weeks\" as anchor number.\n\nSLIDE 4: Fabrication. One to three weeks.\nNOTE: Warm beige background, same layout style. \"1-3 weeks\" as anchor number.\n\nSLIDE 5: Three queues. Three different people. Not one timeline.\nNOTE: Light orange background. Three small distinct boxes or lanes side by side, unlabeled, just to show separation visually.\n\nSLIDE 6: You can watch fabrication happen. You can't watch the other two.\nNOTE: Beige background, plain text, no icons. Let the line carry it.\n\nSLIDE 7: So people budget for the one they can see and forget the two they can't.\nNOTE: Beige background, plain text, slightly smaller than slide 6 to feel like a quieter follow-on.\n\nSLIDE 8: Start the Jawi wording first. It's the only queue you can begin before the design is finished.\nNOTE: Dark background, closer slide. Bold white text, centered, feels like a decision rather than a summary.\n\nCAPTION: Three clocks run on every signboard job, and clients usually notice one of them. Jawi translation takes about a week. ABCi approval takes two to three weeks. Fabrication takes one to three weeks. I never add those into one number, because they aren't one queue, they're three, sitting with three different people. Clients budget time for fabrication because it's the part they can physically watch. The other two happen in someone else's inbox, so most people plan for zero days on them. If you're starting a signage job, get the Jawi wording moving before the design is even locked. It's the only one of the three you can start early.","cards":0},{"date":"2026-09-07","day":"Mon","slug":"consumer fair book ahead","raw_slug":"consumer-fair-book-ahead","body":"I work on the Brunei Consumer Fair, where the floor sells out 4 to 6 months before you see a single poster.\n\n\"We'll book once we see the fair being advertised.\"\n\nBy then the floor has been full for months.\n\nI work for the company that runs the Brunei Consumer Fair. 33 editions since 2008, twice a year, over 100,000 people through the door across 5 days. So I see the part the public never does.\n\nBooths sell out 4 to 6 months ahead. By the time posters go up and the fair is on social media, the floor plan for that edition has been locked for a while.\n\nWhat people think they are deciding late is the booth. What they have actually lost is the position. The traffic corner, the spot near the entrance that every exhibitor asks for first. Those go early because everyone doing this for the second or third time already knows to ask.\n\nNobody is being lazy. Nothing tells you to think about January's fair in September. The only way to know the floor is filling is to have watched it happen, edition after edition.\n\nIf you are thinking about exhibiting at the next one, the useful move is not waiting for the advertising.\n\nAsk about the floor now, while there is still a floor to ask about.\n\n#ConsumerFair #BruneiBusiness #Exhibitions #SmallBusiness","ig":"SLIDE 1: By the time you see the poster, the floor is already full\nNOTE: Dark background, cover slide. Bold white centered text. No literal fair photo, keep it typographic.\n\nSLIDE 2: I help organise the Brunei Consumer Fair\nNOTE: Warm orange background. Smaller text, feels like a credential line, not a headline.\n\nSLIDE 3: 33 editions since 2008. January and June, every year.\nNOTE: Beige background. Number \"33\" large, rest of text smaller underneath.\n\nSLIDE 4: 100,000+ visitors. 600+ booths. 300 exhibitors.\nNOTE: Beige background, same style as slide 3 for consistency, three stacked stats.\n\nSLIDE 5: Booths sell out four to six months ahead\nNOTE: Beige background. \"4-6 months\" as the large anchor number.\n\nSLIDE 6: So when the fair gets advertised, the floor plan is already done\nNOTE: Beige background, plain text, quieter than the stat slides.\n\nSLIDE 7: What you lose by deciding late isn't the booth. It's the position.\nNOTE: Beige background, plain text, this is the turn of the piece, give it room to breathe.\n\nSLIDE 8: Ask about the floor now, while there's still a floor to ask about\nNOTE: Dark background, closer slide. Bold white text, centered.\n\nCAPTION: I work for the company that organises the Brunei Consumer Fair, 33 editions since 2008, twice a year, over 100,000 people through the door across five days. Booths sell out four to six months before each edition. By the time the fair is being advertised to the public, that floor plan has been locked for a while. Most people think they're deciding late on a booth. What they've actually lost is the position, the entrance corners and high traffic spots, which go to whoever asked early. If exhibiting at the next fair has crossed your mind, the move is asking now, not waiting for the posters to remind you.","cards":0},{"date":"2026-09-09","day":"Wed","slug":"jawi first design","raw_slug":"jawi-first-design","body":"I sell signage for a living, and 1 layout decision saves about a week of rework on every shopfront.\n\n\"Why is the Jawi bigger than my own shop name?\"\n\nOn a Brunei shopfront the size order is fixed. Jawi biggest, Malay next, English smallest. I tell them it is an ABCi requirement. Nobody has ever argued.\n\nBut most people hear that as a rule to comply with. I treat it as the first decision in the layout, and that difference is worth about a week of rework.\n\nWatch what happens if you design English first. You pick the fonts, get the spacing right, then try to fit Jawi in afterward. It breaks. You are placing your biggest piece last, into a layout never built to hold it. The spacing cramps, or the English shrinks past what the client wanted, or the board goes back to plan stage.\n\nDesign the Jawi first and none of that happens. It sets the scale. Malay and English fill the space around it instead of fighting it for room. Same reason you do not add a headline after the body text is already laid out.\n\nThe rule is not the interesting part. It tells you what order to work in, and almost nobody uses it that way.\n\nAsk your designer to place the Jawi first, before any English is set. Then check which language got placed first in your current draft.\n\n#Signage #BruneiBusiness #Design #Jawi","ig":"SLIDE 1: Design your signboard in the wrong order and it breaks\nNOTE: Dark background, cover slide. Bold white centered text.\n\nSLIDE 2: On a Brunei shopfront: Jawi biggest, then Malay, then English\nNOTE: Beige background. Three-tier visual, largest to smallest block, no real text needed beyond labels.\n\nSLIDE 3: Most people design the English first\nNOTE: Beige background, plain text, sets up the mistake.\n\nSLIDE 4: Then try to fit Jawi in after, since it has to be the biggest element\nNOTE: Beige background, plain text, continues the setup.\n\nSLIDE 5: It breaks. You're adding the biggest piece last into a layout that wasn't built for it.\nNOTE: Warm orange background, slightly bolder text, this is the friction point of the carousel.\n\nSLIDE 6: Design Jawi first instead\nNOTE: Beige background, simple, this is the turn.\n\nSLIDE 7: It sets the scale for the board. Malay and English fit around it, not against it.\nNOTE: Beige background, plain text.\n\nSLIDE 8: Same reason you don't write a headline after the body text is already laid out\nNOTE: Dark background, closer slide. Bold white centered text.\n\nCAPTION: Jawi is the largest element in the hierarchy on a Brunei shopfront, then Malay, then English. Design the English first and try to fit Jawi in afterward and the layout breaks, because your biggest element just arrived last into a board built to hold something smaller. Design Jawi first and it sets the scale for everything else, Malay and English fit into the space left around it instead of fighting it. Clients ask why the Jawi has to be biggest, I tell them it's an ABCi requirement, and that's the end of it. The interesting part isn't the rule. It's building the layout in the right order so nothing has to be forced in later.","cards":0},{"date":"2026-09-11","day":"Fri","slug":"cheaper quote four things","raw_slug":"cheaper-quote-four-things","body":"I have quoted builds for 4 years, and the gap between two quotes comes down to the same 4 things.\n\n\"Why is his price half of yours?\"\n\nI used to answer that with a lecture about quality. Never worked once. The honest answer is that the two numbers are not answers to the same question.\n\nCheaper material. Slower service, because a smaller shop takes longer to reply. Longer lead time, because the cheap job sits behind the ones that paid full. And print quality, which catches people, because sticker printing and PVC printing are not one product sold at two prices.\n\nNone of that makes the cheaper vendor dishonest. One quote is pricing a build that has to survive the season. The other is pricing a build that has to look right on delivery day. Sometimes that is genuinely all you need.\n\nHere is the real problem. I know which is which by reading the spec. You do not. So the total is the only thing you can see, and you choose on the one number that tells you least.\n\nSo stop comparing totals. Ask both vendors to add 2 lines to the quote. The material type, written in words. The lead time, written in days. On the quote, not over the phone.\n\nSend that request to both vendors this week, before you sign anything.\n\n#Signage #BruneiBusiness #Procurement #SmallBusiness","ig":"SLIDE 1: Two quotes. One is half the price. Which one's right?\nNOTE: Dark background, cover slide. Two price tag icons or two rough quote-paper graphics side by side, one visibly smaller/simpler than the other.\n\nSLIDE 2: They're often not answering the same question.\nNOTE: Warm beige background. Simple two-column layout starting to form, empty for now.\n\nSLIDE 3: Reason 1: a different material type.\nNOTE: Warm orange background. Icon of a material swatch or sheet, one thick/one thin.\n\nSLIDE 4: Reason 2: lower print quality. Sticker printing and PVC printing are not the same product.\nNOTE: Beige background. Two printed sample icons side by side, visibly different textures.\n\nSLIDE 5: Reason 3: slower service.\nNOTE: Warm orange background. Clock or calendar icon with a slow-moving hand.\n\nSLIDE 6: Reason 4: longer lead time.\nNOTE: Beige background. Calendar icon with a longer stretch of days marked.\n\nSLIDE 7: So don't compare the totals. Compare the specs.\nNOTE: Beige background. A quote paper graphic with two lines circled: material type and lead time.\n\nSLIDE 8: Ask both vendors to write the material type and lead time on the quote. Then compare those.\nNOTE: Dark background, closer slide. Clean text on dark, no icon needed.\n\nCAPTION: Four years quoting builds and the gap between two quotes is almost always the same four things. Lower type material. Lower print quality, sticker printing and PVC printing are not the same product at two prices. Slower service. Longer lead time. That means the two totals aren't answering the same question, so comparing them tells you nothing on their own. Ask both vendors to put material type and lead time on the quote itself, in writing, next to the price. Put those two lines side by side and the price gap usually explains itself.","cards":0},{"date":"2026-09-12","day":"Sat","slug":"reference photo wont build","raw_slug":"reference-photo-wont-build","body":"I have quoted builds for 4 years, and a reference photo reliably tells me only 1 thing about the job.\n\nA client sends a photo and says \"make it like this one.\"\n\nIt never once means what the sender assumed.\n\nSame shape, usually. But there is a different material behind it, a different finish on the surface, and a different structure holding it up. None of that is visible on a phone screen.\n\nThe photo is not a spec. It is a feeling someone had for half a second while scrolling.\n\nThere is more information in the frame than people use. 4 things worth looking at.\n\nWhat is it standing on, and is that base visible or tucked out of shot. Where is the light coming from, because a lot of what reads as premium is just strong lighting on ordinary material. What is it actually made of, as opposed to what it has been finished to resemble. And how was it shot, because a wide lens held low makes anything look bigger than it is.\n\nNone of that is written into the photo. All of it has to get built.\n\nWrite one line under it saying what you like. The finish. The weight. The way the light sits on it.\n\nAsk yourself what you actually like about the photo, and send that line with it.\n\n#Signage #Fabrication #Design #SmallBusiness","ig":"SLIDE 1: \"Like this one.\" A photo lands. It's never enough.\nNOTE: Dark background, cover slide. Phone screen graphic with a reference photo icon being forwarded.\n\nSLIDE 2: Same shape. That's usually where the similarity ends.\nNOTE: Warm beige background. Two silhouettes of the same shape, one outlined only.\n\nSLIDE 3: What's it standing on? Is the base even visible in the shot?\nNOTE: Warm orange background. Cropped photo icon showing top of object, base cut off.\n\nSLIDE 4: Where's the light coming from? Good lighting can make an ordinary material look premium.\nNOTE: Beige background. Simple lighting diagram, a lamp angled onto an object.\n\nSLIDE 5: What's it actually made of, versus what it's been finished to resemble?\nNOTE: Warm orange background. Two material swatches, one labelled \"real\", one labelled \"finish\".\n\nSLIDE 6: How was it shot? A low wide lens makes anything look bigger and heavier.\nNOTE: Beige background. Simple camera angle diagram, low tripod pointing up at object.\n\nSLIDE 7: None of that is in the photo. All of it is what gets built.\nNOTE: Beige background. Photo icon crossed out lightly, replaced with a blank spec sheet icon.\n\nSLIDE 8: Next time, say what you like about it. The finish. The weight. The light. That's what can be specified.\nNOTE: Dark background, closer slide. Clean text on dark.\n\nCAPTION: A client sends a photo and says \"like this one.\" Same shape, usually. But a different material behind it, a different finish on the surface, a different structure holding it up, none of which shows up in a picture. The photo is what someone liked, not what they're buying. Look at what it's standing on, where the light is coming from, what it's actually made of versus finished to resemble, and how it was shot, because a low wide lens makes anything look bigger than it is. Next time you send a reference, say what you like about it specifically. The finish, the weight, the way the light sits on it. That's the part that can go into a spec.","cards":0},{"date":"2026-09-14","day":"Mon","slug":"logo doesnt fabricate","raw_slug":"logo-doesnt-fabricate","body":"I have quoted signage for 4 years, and 3 things exist on a wall that simply do not exist on your screen.\n\n\"But the logo already looks perfect.\"\n\nFour years quoting fabrication and I still see this on nearly every job.\n\nThe hairline stroke that reads fine on a laptop has no thickness once you cut it from metal or acrylic. It either gets fatter or it snaps off the router bed.\n\nThe tight counter in a lowercase a or e closes up the moment you shrink it to real size, or fills in completely once there is a light source behind it.\n\nDrop shadows and gradients do not exist in a physical material. You can fake a gradient with layered vinyl and it never matches. Colour drifts anyway once you match a Pantone across acrylic, paint and LED.\n\nNone of this means the logo is bad. It was drawn for a screen, which has no thickness, no weight, and no light behind it. A sign has all 3, whether the person who drew it thought about that or not.\n\nThe fix is simple and most designers hand it over without complaint.\n\nAsk your designer for a single colour, single thickness version before you sign off on anything. Strip the gradient, strip the shadow, pick one line weight throughout.\n\nSend that flat version to your fabricator and ask them to quote against it.\n\n#Signage #Branding #Design #SmallBusiness","ig":"SLIDE 1: A logo that works on screen might not build as a sign\nNOTE: Dark background. Bold white/orange wordmark-style type as cover. No imagery, just type.\n\nSLIDE 2: Hairline strokes have no thickness once cut\nNOTE: Warm beige background. Simple line drawing showing a thin stroke on screen next to the same stroke snapped/broken as a physical cut piece.\n\nSLIDE 3: Tight counters close up or fill with light at real size\nNOTE: Warm beige background. Show a letter like \"e\" or \"a\" zoomed in, counter shrinking to a dot, next to a backlit version where the gap has filled in.\n\nSLIDE 4: Gradients and drop shadows do not exist in vinyl or acrylic\nNOTE: Warm orange background. Split image: gradient logo on a phone screen vs a flat single colour cut piece.\n\nSLIDE 5: Colour drifts across materials\nNOTE: Warm beige background. Three small acrylic/paint/vinyl swatches in \"the same\" colour that visibly do not match.\n\nSLIDE 6: Detail disappears at real viewing distance\nNOTE: Warm beige background. Detailed logo shown large, then the same logo shown small and blurred as it would look from across a room.\n\nSLIDE 7: It is not a bad logo, it is a screen logo\nNOTE: Warm orange background. Simple line: \"No thickness. No weight. No light behind it.\" set in plain type.\n\nSLIDE 8: Ask for a single colour, single thickness version before you approve\nNOTE: Dark closing background. Bold closing line as a takeaway graphic.\n\nCAPTION: A logo that looks perfect on screen can still be unbuildable as a sign. Hairline strokes have no structural thickness once cut. Tight counters close up at small scale or fill in with light behind them. Gradients and drop shadows do not exist in vinyl or acrylic, and colour drifts once you are matching it across different materials. None of that means the logo is bad. It was designed for a medium with no thickness, no weight and no light behind it. Before you sign off on a logo, ask the designer for a single colour, single thickness version of it. That flat file is the one that ends up on the wall.","cards":0},{"date":"2026-09-16","day":"Wed","slug":"booth that stops people","raw_slug":"booth-that-stops-people","body":"I have watched crowds walk past hundreds of booths. You get about 2 seconds, from an angle, from someone still moving.\n\nNot head on. Not standing still. The booths that stop people almost never win on budget.\n\nThe most common mistake is treating the back wall like a poster. Company name, tagline, 5 bullet points, logo soup along the bottom. Nobody walking an aisle reads a paragraph. If one idea survives a glance from across the aisle, that idea is doing the work.\n\nEye level and hip level do different jobs, and most booths use them the same way. What is up high pulls someone in from the aisle. What is at hip level is for the person who already stopped and is close enough to read detail or pick something up. Put the same message at both and you have wasted the second one.\n\nThe other thing that kills booths is a counter used as a wall. It looks tidy from the exhibitor's side and reads as \"we are not open to you\" from the aisle. An open corner does more to pull people in than any banner above it.\n\nStand where the aisle actually approaches your booth, walk it at the pace people walk, and time 2 seconds. Whatever you could not read in that window is what needs fixing first.\n\nAsk where the opening is before you approve the layout.\n\n#Exhibitions #BruneiBusiness #TradeShow #SmallBusiness","ig":"SLIDE 1: What actually stops someone at a booth\nNOTE: Dark background. Bold type cover, maybe a top-down floor plan silhouette of an aisle with booths.\n\nSLIDE 2: People read your booth from an angle, walking, in about two seconds\nNOTE: Warm beige background. Simple diagram of a walking figure passing a booth at an angle, sightline arrow.\n\nSLIDE 3: The back wall is not a poster\nNOTE: Warm beige background. Show a cluttered back wall full of text crossed out, next to one clean single idea.\n\nSLIDE 4: One legible idea beats six competing ones\nNOTE: Warm orange background. Visual comparing a busy wall vs a wall with one bold word or image.\n\nSLIDE 5: Eye level and hip level do different jobs\nNOTE: Warm beige background. Simple booth cross-section showing eye-level signage pulling people in, hip-level detail for people already stopped.\n\nSLIDE 6: A counter can become a barricade\nNOTE: Warm beige background. Side by side: counter blocking the front of a booth vs an open corner with nothing blocking the approach.\n\nSLIDE 7: An open corner outperforms a closed front\nNOTE: Warm orange background. Simple arrow diagram showing foot traffic flowing into an open-corner booth layout.\n\nSLIDE 8: Test it yourself this week\nNOTE: Dark closing background. Bold closing line as a takeaway graphic.\n\nCAPTION: People read a booth from an angle while still walking, not head on and not standing still. The most common mistake is treating the back wall like a poster full of text nobody has time to read. One legible idea beats six competing for attention. Eye level pulls someone in from the aisle, hip level is for the person who already stopped, and they need to do different jobs. A counter used as a barricade reads as keep out, an open corner reads as come in. Go stand where the aisle actually approaches your booth, at walking pace, and see what is readable in two seconds. That is the test worth running before the next show.","cards":0},{"date":"2026-09-18","day":"Fri","slug":"nobody proofreads the wording","raw_slug":"nobody-proofreads-the-wording","body":"A signmaker will build your spelling mistake exactly, at full size, in metal.\n\nWording on a sign is not copy. It is a manufactured part.\n\nThe wording gets typed once, usually into a message, and then it is copied forward into the drawing, the submission and the cutting file. Nobody types it again, so nobody reads it again. The mistake travels the whole way with the job.\n\nA stray space, a missing dot, a shop name that was still being decided when the message was sent. All of it survives to install day, because everyone downstream assumes the person upstream checked.\n\nA design revision costs you a few days. A wrong letter costs you the part.\n\nRead the wording out loud, letter by letter, before you approve the drawing. That is the last point where it is still just text.\n\n#Signage #Specification #SmallBusiness #Brunei","ig":"SLIDE 1: A signmaker will build your spelling mistake exactly.\nNOTE: Dark background. Full size, in metal\n\nSLIDE 2: Wording on a sign is not copy.\nNOTE: Orange background. It is a manufactured part\n\nSLIDE 3: It gets typed once. Into a message.\nNOTE: Beige background. That is the only time anyone writes it\n\nSLIDE 4: Then copied into the drawing.\nNOTE: Beige background. Copy, not retype\n\nSLIDE 5: Copied into the submission.\nNOTE: Beige background. Still nobody reading it\n\nSLIDE 6: Copied into the cutting file.\nNOTE: Beige background. Now a machine has it\n\nSLIDE 7: Nobody types it again, so nobody reads it again.\nNOTE: Orange background. The mistake travels with the job\n\nSLIDE 8: A stray space. A missing dot. A name still being decided.\nNOTE: Beige background. All of it survives to install day\n\nSLIDE 9: A design revision costs you a few days. A wrong letter costs you the part.\nNOTE: Beige background. Different order of mistake\n\nSLIDE 10: Read the wording out loud, letter by letter, before you approve the drawing.\nNOTE: Dark background. Last point where it is still just text\n\nCAPTION: A signmaker will build your spelling mistake exactly, at full size. Wording on a sign is not copy. It is a manufactured part. It gets typed once, into a message, then copied into the drawing, the submission and the cutting file. Nobody types it again, so nobody reads it again, and the mistake travels the whole way with the job. A design revision costs you a few days. A wrong letter costs you the part.\n\nRead the wording out loud, letter by letter, before you approve the drawing.\n\nSave this before you approve your next drawing.\n\n#Signage #Specification #MSMEBrunei #SmallBusiness","cards":0},{"date":"2026-09-19","day":"Sat","slug":"the wall decides the sign","raw_slug":"the-wall-decides-the-sign","body":"Nobody asks what the wall is made of. It is the first thing that decides what your sign can be.\n\nThe wall is not where the sign goes. It is part of the sign.\n\nA glass shopfront, a plaster face, metal cladding and a tiled column are four different jobs. Each one takes a different fixing. Some of them cannot hold a sign at all without reaching through to the structure behind, and that changes the depth, the weight limit and sometimes the design itself.\n\nWhat happens instead is the design gets approved first, and the wall gets looked at on install day. That is when someone finds out the front is glass and the mount has nowhere to go. The sign is already built by then, so the choice is a redesign or a compromise on site.\n\nThe compromise is the expensive one, because it is decided in an hour by whoever is standing there with a drill.\n\nAsk what the sign will be fixed into, before you approve the design. Then send a photo of the bare surface, not the shopfront.\n\n#Signage #Retail #SmallBusiness #Design","ig":"SLIDE 1: Nobody asks what the wall is made of.\nNOTE: Dark background. It gets checked last\n\nSLIDE 2: It is the first thing that decides what your sign can be.\nNOTE: Orange background. Before the design, before the quote\n\nSLIDE 3: The wall is not where the sign goes. It is part of the sign.\nNOTE: Beige background. The reframe\n\nSLIDE 4: Glass.\nNOTE: Beige background. Cannot take a fixing on its own\n\nSLIDE 5: Plaster.\nNOTE: Beige background. Holds the screw, not the weight\n\nSLIDE 6: Metal cladding.\nNOTE: Beige background. Hollow behind, different mount\n\nSLIDE 7: A tiled column.\nNOTE: Beige background. Drill through and you own the crack\n\nSLIDE 8: The design gets approved first. The wall gets looked at on install day.\nNOTE: Orange background. Wrong order\n\nSLIDE 9: By then the sign is already built.\nNOTE: Beige background. Redesign, or compromise on site\n\nSLIDE 10: Ask what the sign will be fixed into, before you approve the design.\nNOTE: Dark background. Send a photo of the bare surface, not the shopfront\n\nCAPTION: Nobody asks what the wall is made of, and it is the first thing that decides what your sign can be. The wall is not where the sign goes. It is part of the sign. Glass, plaster, metal cladding and a tiled column are four different fixings, and some of them cannot hold a sign at all without reaching through to the structure behind. What happens instead is the design gets approved first and the wall gets looked at on install day. That is when someone finds out the front is glass and the mount has nowhere to go, and the sign is already built.\n\nAsk what the sign will be fixed into, before you approve the design.\n\nSave this before your next quote.\n\n#Signage #Retail #MSMEBrunei #Design","cards":0}],"threads":[{"date":"2026-09-05","time":"20:00","slug":"where before what","raw_slug":"where-before-what","chain":["The wall decides the build. How high it sits, what it can be fixed into, whether there is power behind it, whether rain runs down it.\n\nMove the same drawing from an indoor lobby to an outdoor shopfront and it is a different object, with a different material and a different lead time.","Almost everyone sends the design first and the location last. Then the location rewrites the design, and the second round of drawings feels like the vendor changing their mind.\n\nIt was never the design. It was the wall arriving late.","Ask for the location to be confirmed before the design is signed off.\n\nA photo of the actual wall does more than a page of notes."],"text":"The 2nd question I ask on any sign job is not what it says. It is where it goes.\n\nThat answer changes the object more than the design does."},{"date":"2026-09-06","time":"14:00","slug":"the part behind the sign","raw_slug":"the-part-behind-the-sign","chain":["A sign is two things bolted together. The face you look at, and the structure holding it up.\n\nThe face decides how it looks on day one. The structure decides whether it is still straight a year later. Only one of those gets designed, revised and signed off.","I have seen material used on outdoor structures that was never meant to sit outdoors. From the road it looked completely fine.\n\nWhat gave way was never the part anyone had approved.","Ask two things before you approve the front. What the backing is made of, and how it is fixed to the wall.\n\nThose two answers decide how long the sign keeps looking new."],"text":"Every client approves the front of the sign. In 4 years almost nobody has asked me what is behind it."},{"date":"2026-09-06","time":"20:00","slug":"letter size is a distance","raw_slug":"letter-size-is-a-distance","chain":["Letter size is not a design decision. It is a distance decision.\n\nA shop on a walkway is read from a few steps away. The same shop on a road is read from a moving car. Two different letter sizes, and the board can be identical in both.","What people do instead is size the lettering to fill the space they were given.\n\nIt looks balanced on the drawing, it looks balanced on the wall, and it is still unreadable from where customers actually are. Nothing looks broken, so nobody reports it back.","Ask what distance the sign is read from, before you approve any dimensions.\n\nThen go and stand where your customer stands."],"text":"Letter size is not 1 design decision. It is a distance decision, and there are 2 distances that matter.\n\nPeople size it by looking at the wall. The wall is the wrong thing to look at."},{"date":"2026-09-07","time":"14:00","slug":"the wall decides the sign","raw_slug":"the-wall-decides-the-sign","chain":["The wall is not where the sign goes. It is part of the sign.\n\nGlass, plaster, metal cladding, a tiled column. Four different fixings. Some of them cannot hold a sign at all without reaching through to the structure behind.","What happens instead is the design gets approved first and the wall gets looked at on install day.\n\nThat is when someone finds out the front is glass and the mount has nowhere to go. The sign is already built by then.","Ask what the sign will be fixed into, before you approve the design.\n\nThen send a photo of the bare surface. Not the shopfront."],"text":"Nobody asks what the wall is made of. It is the 1st thing that decides what your sign can be, and it gets checked last."},{"date":"2026-09-07","time":"20:00","slug":"lit sign two appearances","raw_slug":"lit-sign-two-appearances","chain":["A lit sign is not one design. It is two.\n\nIn daylight it is a coloured panel read by the sun. At night it is a light source, and light comes through everything the daytime hid. The joins, the lamp spacing, the fixings, the dust inside the box.","What people do instead is approve a drawing rendered in daylight, then meet the night version on install night.\n\nLetters that looked evenly spaced now have bright edges and dark middles. The light behind them was never spaced for those shapes.","Ask to see a night photo of a job they already built, before you approve a lit sign.\n\nAnyone who builds lit signs has one on their phone."],"text":"A lit sign has 2 appearances. Almost every client only ever approves the first one."},{"date":"2026-09-08","time":"14:00","slug":"sample is a different colour","raw_slug":"sample-is-a-different-colour","chain":["A sample is not a small version of the sign. It is a different amount of light.\n\nColour gets louder as the area grows. A chip at arm's length under shop lighting is doing almost nothing. The same pigment across a whole shopfront throws light back at you all day.","What happens is the client approves indoors, in the dark corner where the samples live.\n\nThey meet the real thing when it is already on the wall. It is never wrong. It is louder than they pictured, and nothing can be fixed, because the code was followed exactly.","Ask to see the colour on the biggest piece they have, outdoors, before you sign off the code."],"text":"The colour on a sample chip is not the colour on your shopfront. Same code, 2 different results."},{"date":"2026-09-08","time":"20:00","slug":"finish before colour","raw_slug":"finish-before-colour","chain":["Finish is not a taste decision. It is a visibility decision.\n\nA glossy face throws light straight back at whoever is looking. On a wall facing the sun it becomes a mirror of the sky, and the lettering disappears. A matte face scatters the same light instead of aiming it.","Nobody asks about it, because finish sits in the quote as one word next to the colour. It reads as a preference.\n\nThe client stands outside at 9am and the sign is perfect. At 1pm it is a bright rectangle with nothing on it.","Ask what finish the face has, before you approve the colour.\n\nThen go and look at the wall at midday."],"text":"Two shops can order the same colour code and only 1 of them is readable at midday."},{"date":"2026-09-09","time":"14:00","slug":"where the water gets out","raw_slug":"where-the-water-gets-out","chain":["A sign box is not a waterproof container. It is a container with a way out.\n\nHumid air gets in whatever you do. The sun heats the box, it cools at night, and that air turns into water on the bottom panel. Sealing it harder does not stop that. It stops the water leaving.","So the water sits, and what it sits against is the electrics and the steel.\n\nA face that looks fine outside can be corroding inside for months. It shows up as a dead section of light, or a rust line bleeding down the wall. By then the repair is the whole box.","Ask where the water gets out, before you approve the box.\n\nIt is one sentence, and it is not a normal question. That is exactly why the answer tells you a lot."],"text":"A box sign is not sealed. It is drained, on purpose. In 4 years nobody has ever asked me where the water leaves."},{"date":"2026-09-09","time":"20:00","slug":"before the keys","raw_slug":"before-the-keys","chain":["The application is not a picture of your finished unit. It is a set of drawings. Site plan, fixture point, wording, letter size, materials, Jawi wording, your logo defined in writing.\n\nEvery one of them can be done in an empty room.","An empty unit is the cheapest place to keep a sign job. Nothing is printed, nothing is bolted, and a change costs a new drawing.\n\nThe same change gets more expensive every week you leave it.","Ask your signmaker what they can start with this week, before the tiles go down.\n\nUsually it is your wording and your logo. You already decided both."],"text":"Start the signage application the day you get the keys. Not one of its 7 items needs a finished shop."},{"date":"2026-09-10","time":"14:00","slug":"change your mind deadline","raw_slug":"change-your-mind-deadline","chain":["The application is not a request for permission to put up a sign. It is a description of the exact sign. Colour, height, materials, mounting, letter size, wording.\n\nChange one after it is lodged and you are no longer editing a design.","That is why a late colour change feels wildly out of proportion to a client. On the drawing it takes 10 seconds.\n\nOn a lodged application it is a different sign to the one described.","Ask which decisions get frozen at submission, before you sign off the drawing.\n\nThen spend your indecision that week, instead of the week the sign is being built."],"text":"The last day to change your sign is not install day. It is the day the application goes in, weeks earlier."},{"date":"2026-09-10","time":"20:00","slug":"acrylic thickness lifespan","raw_slug":"acrylic-thickness-lifespan","chain":["A thin sheet has almost nothing to give up. A thick one has a sacrificial layer.\n\nSame sun, same wall, same year. One is still fine and one is not.","And it does not fade politely.\n\nIt cracks. Fine cracks like a spider web, starting at the screw holes, because that is where the stress already is.\n\nOnce those appear the sheet has lost about half its strength.","So when a quote says acrylic, that word alone tells you almost nothing.\n\nAsk how thick it is, in millimetres, and get it written on the quote.\n\nTwo signs made of the same material can be years apart."],"text":"Acrylic is plastic, and the Brunei sun eats it from the outside in.\n\nOnly the top half millimetre takes the damage. So thickness here is not about strength. It is about how much material you have to lose."},{"date":"2026-09-11","time":"14:00","slug":"fair date is not your deadline","raw_slug":"fair-date-is-not-your-deadline","chain":["An exhibition is not one deadline. It is a stack of earlier ones. Artwork approved, printed, delivered, built.\n\nThe date you wrote in your calendar is the last of them, not the first.","300 exhibitors share one opening morning. The booths that look finished at 10am on day one belong to people who set their own date weeks ahead of the fair's.\n\nThe half built ones were working to the poster.","Ask every supplier for their cutoff date, before you approve the booth design.\n\nWork backwards from the earliest one. That is your real deadline."],"text":"The date on the fair poster is not your deadline. Your printer's is, and nobody publishes that one."},{"date":"2026-09-11","time":"20:00","slug":"plan for the second pass","raw_slug":"plan-for-the-second-pass","chain":["A comment is not a failure. It is a second pass. Revisions are how this process normally runs, so a schedule that only fits one pass is already late.","The one I watched came back asking for a change to the Jawi proportion. On a drawing that is an afternoon of work.\n\nTheir calendar had no afternoon left in it.","Ask your vendor how many rounds their date assumes, before you announce an opening day.\n\nIf the answer is one, it is not a date. It is a best case."],"text":"Signage applications here rarely get rejected. They come back with comments. Plan for 2 rounds, not 1."},{"date":"2026-09-12","time":"14:00","slug":"who signs it off","raw_slug":"who-signs-it-off","chain":["Approval is not a step at the end. It is a person, and you choose them at the start.\n\nEvery drawing before that person sees it is a guess about what they will accept.","Two weeks of drawings go back and forth with a manager. The owner sees it once, on sign off day, and changes the wording.\n\nNothing was wrong with the design. It was shown to the wrong person first.","Ask who has final say before the first drawing gets drawn.\n\nThen put that person in the thread."],"text":"The person who approves your sign is usually not in the chat where it gets designed."},{"date":"2026-09-12","time":"20:00","slug":"nobody proofreads the wording","raw_slug":"nobody-proofreads-the-wording","chain":["Wording on a sign is not copy. It is a manufactured part.\n\nOnce it is approved it stops being something you read and starts being something a machine cuts.","The wording gets typed once, into a message. Then it is copied into the drawing, into the submission, into the cutting file.\n\nNobody types it again, so nobody reads it again. The mistake travels the whole way with the job.","Read the wording out loud, letter by letter, before you approve the drawing.\n\nThat is the last point where it is still only text."],"text":"A signmaker will build your spelling mistake exactly, at full size."},{"date":"2026-09-13","time":"14:00","slug":"photo with no measurement","raw_slug":"photo-with-no-measurement","chain":["A photo is not a measurement. It is a shape with no scale.\n\nNothing in the frame tells me how big the wall is unless you put something known next to it.","Two shopfronts photographed from across the road look identical on a phone screen. One takes a sign twice the size of the other.\n\nSo the quote comes back with an assumption inside it, and the assumption is the part that changes later.","Send one measured width with the photo, before you ask anyone to quote.\n\nA tape across the shopfront takes a minute."],"text":"Almost every wall photo I get is missing 1 thing, and it is the only thing I need."},{"date":"2026-09-13","time":"20:00","slug":"ask for your files back","raw_slug":"ask-for-your-files-back","chain":["The artwork file is not a leftover. It is the only record of how your sign was built.\n\nFont, letter spacing, colour code, exact widths. One file, one machine.","A second branch opens two years later and nobody can find the file, so the new sign gets matched by eye.\n\nThe two shopfronts end up close. Close is the kind of wrong customers notice without being able to say why.","Ask for the final artwork and the colour code before the job closes.\n\nIt is a one line request while everyone is still paying attention."],"text":"The 1 thing to ask for after your sign goes up is the file it was made from."},{"date":"2026-09-14","time":"14:00","slug":"access before install day","raw_slug":"access-before-install-day","chain":["Install is not a job your vendor controls. It is a slot somebody else owns.\n\nThe shutter, the lift, the building hours, the space out front where a ladder has to stand. None of those belong to the person building your sign.","The crew turns up in the morning and the shop next door is already trading, so the ladder cannot stand where it needs to.\n\nNothing is faulty and nobody is late. Everyone goes home and comes back at night.","Ask who controls access to the wall, and what hours they allow, before you fix the install date.\n\nOne phone call, made in the right week."],"text":"A sign can be finished on time and still sit in the workshop for a week, waiting for someone with a key."},{"date":"2026-09-14","time":"20:00","slug":"where the join lands","raw_slug":"where-the-join-lands","chain":["A join is not a fault. It is a position.\n\nIt can sit in the gap between two words, where your eye walks past it. Or it can run down the middle of a letter and straight through your logo. Both cost the same to make.","What happens is the artwork gets approved as one flat picture on a screen. The panels get decided later, at the cutting table, by whoever is cutting that day.\n\nThe client meets the join standing on the pavement on install day. By then it is a permanent line through the second word.","Ask where the join lands, before the artwork goes for cutting.\n\nPoint at the gap you want it in. At that stage it moves for free. After that it does not move at all."],"text":"Every long sign has a join in it. Sheet material comes in fixed widths, so anything wider than the sheet gets built in 2 or 3 panels. The join has to land somewhere, and usually it lands wherever the cutting was easiest."},{"date":"2026-09-15","time":"14:00","slug":"which face of the glass","raw_slug":"which-face-of-the-glass","chain":["The glass is not a surface to stick to. It is a cover to hide behind.\n\nVinyl on the outside face takes the rain, the squeegee, and every cleaning cloth for the life of the shop. Vinyl on the inside face is protected by the glass, and nothing ever touches it.","So the thing that kills outside lettering is not colour, it is edges. A corner lifts, someone catches it with a cloth, and the letter peels off in one pull.\n\nThe same vinyl on the inside face is still flat, because the only thing anyone ever wipes is the glass.","Ask which face of the glass the lettering goes on, before you approve the mock-up.\n\nThe answer also tells you whether the quote includes reverse printing. If the person quoting has not thought about the side, they have not thought about the file either."],"text":"Which side of the glass changes the artwork. Lettering on the outside face and lettering on the inside face are 2 different files, because the inside one has to be printed in reverse. Same design on your screen. Different job."},{"date":"2026-09-15","time":"20:00","slug":"the part you cannot rush","raw_slug":"the-part-you-cannot-rush","chain":["That wait is not slow service. It is an approval, and you are not the one allowed to lodge it.\n\nIn Brunei only an ABCi-registered advertising company can submit the application. So the wait cannot start early and cannot be hurried along.","Every other trade on a shopfront scales with money. Short on time on the tiling, put 2 more tilers on it.\n\nThe approval sits at the same speed whoever is paying, and it is the one part most people leave until the shop is nearly finished.","Ask which parts of your shopfront need somebody else's yes, before you pick an opening date.\n\nBuild the date around those. The rest of the trades can be pushed. That one cannot."],"text":"2 to 3 weeks of a signage schedule is waiting, not making. Adding people to the job does not shorten it."},{"date":"2026-09-16","time":"14:00","slug":"power to the wall","raw_slug":"power-to-the-wall","chain":["The power is not part of the sign. It is part of the building.\n\nThe vendor brings a box to the wall and connects it to whatever is already there. Getting a live point to that wall, and a switch someone can reach, belongs to whoever wires the shop.","The crew mounts the box in the morning, opens the back, and there is nothing to connect to. The nearest point is inside, behind a wall that got painted last week.\n\nThe sign is fine. It just sits there dark until the electrician comes back.","Ask who is bringing power to that wall, and on what date, before you approve the lighting.\n\nIf the answer is the electrician, get the date from the electrician."],"text":"A lit sign is 2 jobs. Only 1 of them is the sign."},{"date":"2026-09-16","time":"20:00","slug":"the page with no sign","raw_slug":"the-page-with-no-sign","chain":["It is the site plan. That page is not a drawing of your sign. It is a drawing of where your building sits.\n\nThe submission has to place the shopfront on the ground before anyone looks at what goes on the wall.","People arrive with the logo ready and the wording ready. Almost nobody arrives with the site plan, because it is not a page you design. It is a page you go and find.\n\nSo the folder ends up complete except for the one sheet nobody thought about.","Ask who is getting your site plan, before the design work starts.\n\nIt is the only page in that folder no amount of drawing will produce."],"text":"Of the 7 plans in a Brunei signage application, the first one has no sign in it at all."},{"date":"2026-09-17","time":"14:00","slug":"clock starts at the last file","raw_slug":"clock-starts-at-the-last-file","chain":["A quoted lead time is not a countdown from today. It is a duration, and it only begins once the vendor is holding everything.\n\nA deposit does not start it. A complete folder does.","2 items arrive late almost every time. The Jawi wording, and a written definition of your own logo.\n\nNobody walks in holding either one, so the job waits in a drawer nobody is looking at.","Ask your vendor what they are still missing, before you ask them for a date.\n\nA date quoted with 2 files outstanding is a guess, and it moves without anyone deciding to move it."],"text":"Your lead time does not start when you pay. It starts when the last file lands."},{"date":"2026-09-17","time":"20:00","slug":"the wall is your background","raw_slug":"the-wall-is-your-background","chain":["The wall is not behind the sign. It is inside it.\n\nOn screen the letters sit on white. On the shopfront they sit on whatever the building was painted last.","What happens instead is the artwork gets approved as a picture with a clean white edge around it. Nobody puts it onto a photo of the actual wall.\n\nThe first time the two colours meet is install day, and the letters are already cut by then.","Ask to see the letters on a photo of the real wall, before anything goes for cutting.\n\nAnd if the shopfront is being repainted this year, that paint colour is now a design decision. Ask what it is."],"text":"If your letters are cut out and mounted one by one, the wall between them is part of the logo. 8 letters means 7 gaps of bare wall showing through the name."},{"date":"2026-09-18","time":"14:00","slug":"who answers in a day","raw_slug":"who-answers-in-a-day","chain":["Approval is not the end of your part. It is the start of it.\n\nThe drawing settles what it shows. Colour on the return edge, which way the logo sits when the panel is trimmed, what the fixings land on. Nobody drew those, and they come up at the machine.","The workshop emails on a Thursday afternoon asking which of two greys the sides should be. The person who can answer is on leave and nobody else will pick.\n\nBy Monday the machine has moved to the next job and yours is behind it.","Name the 1 person who can answer a question about the sign in a day, and give your vendor that name, before the drawing goes to the workshop.\n\nIf that person travels, name a second one."],"text":"A sign job asks you 4 more questions after you have already approved the design. Each one stops the work until somebody answers."},{"date":"2026-09-18","time":"20:00","slug":"the old sign comes down","raw_slug":"the-old-sign-comes-down","chain":["Taking the old sign down is not the first step of the installation. It is a small demolition.\n\nIt leaves bolt holes, dead wiring, and a rectangle of wall that has not seen sun in 6 years. That rectangle is a different colour to the rest of the shopfront.","The new sign is 20cm shorter than the old one. It goes up straight and clean, and the old outline shows either side of it in darker paint.\n\nThe sign is right. The shopfront still looks half finished.","Ask what is behind the old sign, and who is patching and painting that wall, before you fix the installation date.\n\nIf the answer is the sign crew, get it into the quote. If it is your renovation contractor, they need the date."],"text":"Before the new sign goes up, the old one has to come down. That is a second job, and it is usually on nobody's list."},{"date":"2026-09-19","time":"14:00","slug":"what the letters are made of","raw_slug":"what-the-letters-are-made-of","chain":["Material is not a supply decision. It is a declared item. That sheet carries materials, mounting, colour and height together, so what gets approved already says what the thing is built from and how it hangs.","People arrive knowing the colour and knowing the wording. Ask what the letters are made of and the answer is usually whatever you normally use.\n\nThat answer works fine standing in a shop. It does not fill in a page that wants four things at once.","Ask what the letters are made of before the folder goes in.\n\nIt is a 10 second question while it is still a sheet of paper. It is a different question after."],"text":"One sheet in a Brunei signage application says what your sign is made of. Most owners think that page belongs to the workshop."}]},"scripts":[{"title":"Lost Luggage","ch":"qc","body":"# What Happens To Your Lost Luggage\n\n## ACT 1\n\nYour bag does not arrive.\n\nYou stand at the belt until it stops moving and there is nobody left but you and one unclaimed pushchair.\n\nYou file a report. You are given a reference number. Somebody says the words \"it will probably turn up.\"\n\nMost of the time it does. About one bag in every two hundred goes missing for a while.\n\nBut some never come back to you at all. And those ones go somewhere very specific.\n\n## ACT 2\n\nFirst, the airline has to try.\n\nEvery bag has a tag with a ten digit number on it. That number goes into a worldwide tracing system that almost every airline shares.\n\nIf your bag is scanned anywhere, the system matches it to your report.\n\nMost bags are found in the first two days. They were loaded onto the wrong aircraft, or they missed a tight connection and travelled a day behind you.\n\nThe airline has to keep looking. Under the Montreal Convention, once a bag is missing for twenty one days it is officially declared lost, and they owe you compensation.\n\nThat limit is about one thousand seven hundred pounds worth of a currency called Special Drawing Rights. Not the value of what was inside.\n\n## ACT 3\n\nNow here is the part nobody tells you.\n\nOnce the airline pays you, the bag stops being yours.\n\nYou were compensated. The airline took the loss. So if that bag is ever found again, it belongs to the airline, not to you.\n\nAnd airlines do not want a warehouse full of strangers' underwear.\n\nSo they sell them.\n\n## ACT 4\n\nIn the United States, almost all of it ends up in one place.\n\nA town called Scottsboro, in Alabama, population about fifteen thousand.\n\nThere is a shop there called the Unclaimed Baggage Center. It has contracts with airlines to buy their unclaimed bags in bulk, unopened, without knowing what is inside.\n\nIt is the size of a city block. More than a million items pass through it every year.\n\nRoughly seven thousand new items go onto the shelves every single day.\n\n## ACT 5\n\nEvery bag that arrives gets opened by a person.\n\nAbout a third of what is inside is good enough to sell. It is cleaned, priced and put out on the floor.\n\nAbout a third is donated.\n\nAnd about a third is thrown away, because it is somebody's used toothbrush and their half finished bottle of shampoo.\n\nClothes go through an in house laundry that washes tens of thousands of garments a year.\n\nLaptops and phones are wiped completely before anything is sold.\n\n## ACT 6\n\nThe strange things get their own display case.\n\nStaff there have found a full suit of armour. A shrunken head. A violin from the eighteen hundreds. A guidance system for a fighter jet, which was returned to the government.\n\nA rattlesnake, alive.\n\nAnd once, a camera that had been used to film underwater at a shipwreck.\n\nNone of these were stolen. Somebody packed each one, checked it in, and then never came back for it.\n\n## ACT 7\n\nSo the honest ending is this.\n\nYour bag is almost certainly fine. The system finds nearly all of them within a couple of days.\n\nBut if yours is one of the very few that never surfaces, it did not vanish. It was scanned, searched for, given up on, paid out, sold in bulk, opened by a stranger in Alabama, and put on a shelf with a price tag on it.\n\nSomebody else is wearing your shirt.\n\nAnd they have no idea it was ever yours.","lines":37,"built":true},{"title":"Tunnel Worker","ch":"dt","body":"# POV: You Dig Tunnels Under a Live City\n\n## ACT 1\n\nYou go to work by going down.\n\nA cage lift drops you thirty metres below a street where people are buying coffee, and the doors open onto a tunnel that is being built one metre at a time.\n\nAbove your head is a city that does not know you are here.\n\n## ACT 2\n\nThe machine you work on is called a tunnel boring machine.\n\nIt is not a drill. It is a factory laid on its side, a hundred metres long, that eats ground at the front and lays finished tunnel wall at the back.\n\nThe cutting head turns slowly. Slower than you expect. A few centimetres a minute on a good day.\n\nYou do not watch it work. You work inside it.\n\n## ACT 3\n\nThe most dangerous moment is not the digging.\n\nIt is the face. The exposed ground at the front, where the earth has been cut away and nothing is holding it yet.\n\nModern machines keep that face under pressure so the ground outside cannot collapse inward. The pressure is balanced against the weight of everything above you.\n\nIf it drops, the ground comes in.\n\n## ACT 4\n\nSometimes a person has to go into that pressurised space.\n\nTo change a cutting tooth, or clear an obstruction the machine cannot chew.\n\nThey call it a hyperbaric intervention. You go in through an airlock, into compressed air, and you work in a space the size of a small room with the whole city sitting on top of it.\n\nThen you come out slowly. You decompress, exactly like a diver, because you have been breathing air under pressure and it is now dissolved in your blood.\n\n## ACT 5\n\nCome out too fast and you get decompression sickness.\n\nNitrogen comes out of solution as bubbles inside your joints, your spine, your brain.\n\nIt is the same illness divers get, in a tunnel, under a road.\n\nThat is why the medical rules for compressed air work are written into law in most countries, with time limits per shift and mandatory decompression tables.\n\n## ACT 6\n\nThe other thing you learn to fear is water.\n\nYou are digging under a city, and cities sit on rivers, on old wells, on buried streams somebody filled in a century ago and did not record.\n\nThe ground changes without warning. Clay, then sand, then gravel full of water.\n\nThe machine has to be pressurised for what is in front of it, and what is in front of it is not always what the survey said.\n\n## ACT 7\n\nAbove you, life continues as normal.\n\nThere is a limit to how much the surface is allowed to move while you pass beneath it. On major projects it is measured in millimetres, monitored constantly, building by building.\n\nSomeone is watching a screen that shows whether a terrace of houses has settled by six millimetres or ten.\n\nIf it moves too much, you stop. Then they inject grout into the ground to lift it back.\n\n## ACT 8\n\nYou will also find things.\n\nTunnellers hit plague pits, Roman walls, ships buried in what used to be a shoreline, unexploded bombs from a war that ended eighty years ago.\n\nEvery one of those stops the machine. An archaeologist comes down. A bomb disposal team comes down.\n\nThe tunnel waits, costing an enormous amount of money per day, because someone found a wall.\n\n## ACT 9\n\nThere is a tradition that most tunnellers keep.\n\nBefore boring begins, a statue of Saint Barbara is placed at the tunnel mouth. She is the patron saint of miners and of those who work with explosives.\n\nShe stays there until the machine breaks through at the far end.\n\nNobody will tell you they believe in it. Nobody will take it down either.\n\n## ACT 10\n\nThe breakthrough is the only day that looks like the photographs.\n\nThe cutting head comes through the far wall into daylight or into a finished station box, and there are people waiting, and everyone is filthy and shouting.\n\nThen the machine is dismantled, sometimes buried in place because it is cheaper than lifting it out.\n\nAnd the tunnel you spent two years inside becomes a train that takes ninety seconds to pass through it.\n\nNobody on that train will ever think about the face.","lines":40,"built":true},{"title":"Offshore Rig","ch":"dt","body":"# POV: You Work 3 Weeks Offshore With No Way Off\n\n## ACT 1\n\nThe helicopter lifts off the pad and you watch the coast go.\n\nEleven minutes later there is nothing under you but grey water in every direction.\n\nYou will be standing on a steel platform in the middle of it for the next twenty one days, and there is no road home. No car. No walking out.\n\nIf you change your mind on day three, you do not leave. You wait.\n\n## ACT 2\n\nThe platform is smaller than people imagine.\n\nA few decks of steel bolted to legs that go down to the seabed, or floating and held in place by anchors and thrusters.\n\nYour cabin is a bunk in a shared room. You get a locker. The bed is often shared too, on opposite shifts, which the industry calls hot bunking.\n\nYou sleep in it while a stranger works. Then he sleeps in it while you work.\n\n## ACT 3\n\nYour day is twelve hours on, twelve hours off, and it does not change.\n\nSame twelve hours, every day, for the whole trip. Days and nights stop meaning anything. Sunday does not exist out here.\n\nThere is no commute. You get up, eat, and walk fifty metres to work.\n\nThat is the part people underestimate. Twelve hours of work, and then you are still at work. The place you rest and the place you labour are the same building.\n\n## ACT 4\n\nThe first thing you are taught is not the job. It is how to leave.\n\nYou do a survival course before you ever fly out. They put you in a mock helicopter cabin, lower it into a pool, and roll it upside down while you are strapped in.\n\nYou have to wait for the movement to stop, find your reference point, release the harness, and swim out through the window in the dark.\n\nThey train that because helicopter transport is the single most dangerous part of the job.\n\n## ACT 5\n\nThen there is the muster alarm.\n\nWhen it sounds, everyone drops what they are doing and goes to a designated point to be counted. It happens for real and it happens as a drill, and you are not told which.\n\nYou know where your lifeboat is. You know your number in it.\n\nThe lifeboats hang off the side, enclosed and orange, designed to be dropped into the sea with everyone strapped inside.\n\nYou will probably never use it. You will also never stop knowing exactly how far away it is.\n\n## ACT 6\n\nThe rig is a place where small mistakes are expensive.\n\nThere is machinery under pressure. There is gas. Everything is metal and moving, and the deck is wet.\n\nSo the culture is procedure. Permits to work. Toolbox talks before a task. Someone whose job it is to stop the job.\n\nAnyone can stop the job. That is a real rule, and it is written down. The newest person on the deck can halt a million dollar operation if something looks wrong, and they are not supposed to be punished for it.\n\n## ACT 7\n\nThere is no alcohol. There are no drugs. The whole platform is dry, and you can be tested.\n\nEveryone smokes in one designated place or not at all, because an open flame in the wrong spot is a catastrophe.\n\nFood is the one thing that is genuinely good. The galley runs constantly, because a third of the crew is always on the wrong shift for a normal mealtime. There is usually more than you can eat.\n\nPeople joke that they arrive fit and go home heavier.\n\n## ACT 8\n\nThe part nobody warns you about is what happens to time.\n\nTwenty one days is not long. But you are awake for the same twelve hours in the same rooms with the same forty people, and there is nowhere else to go.\n\nYou cannot go for a walk to clear your head. You can walk the deck. That is the walk.\n\nThe weather decides things. If it is bad enough, the helicopter does not come, and your trip extends. You find out you are staying another two days from a notice, not from a choice.\n\n## ACT 9\n\nThen something happens at home that you cannot do anything about.\n\nSomebody is ill. A pipe bursts. A child has a bad week.\n\nYou hear about it on a phone call, and then you go to work, because there is no version of this where you get on a plane that afternoon.\n\nThat is the actual cost of the job, and it is not the danger. It is being unreachable in the way that matters.\n\n## ACT 10\n\nAnd then the helicopter comes back.\n\nYou hand over to your opposite number, the man who sleeps in your bunk. You fly eleven minutes over grey water and the coast reappears.\n\nYou have twenty one days off. Most people do not have that.\n\nFor the first three days at home you keep waking at the wrong hour, because your body is still on the shift.\n\nThen you get used to being somewhere with doors that lead outside.\n\nAnd then you pack, and you go back.","lines":43,"built":false},{"title":"Sin Eater","ch":"dt","body":"# WHAT IT'S LIKE TO BE A SIN EATER\nEpisode 1. Target 15 to 16 minutes. Second person throughout.\n\nLAST LINE, written first, everything above earns it:\n> You spent your whole life carrying other people's sins so they could rest.\n> Nobody is coming to carry yours.\n\n---\n\n## THE SCRIPT\n\n### ACT 1. ORDINARY COMPETENCE (0:00 to 1:10)\n\nYou are hungry.\n\nNot the kind of hungry that ends when you get home. The kind that has been with\nyou since the frost came, that sits behind your eyes and makes the light hurt.\nYou are somewhere on the road between Ross and Hereford in the year 1686, and\nyou have eaten nothing today except a handful of blackberries that were not\nready.\n\nYou live in a cottage on the high road. One room. A door that does not close\nproperly. You have work when there is work, and there has not been work since\nthe harvest ended.\n\nYou are not a bad man. You want that on the record before any of this starts.\nYou are a man who is hungry.\n\nTonight there is a light in a farmhouse down the valley that has been burning\ntoo long. You know what that means. Somebody in that house is dying, or has\nalready died, and the family is sitting up with the body.\n\nYou go back inside. You lie down. You are almost asleep when you hear boots on\nthe path.\n\n[PAUSE 1.0s]\n\n### ACT 2. THE INTRUSION (1:10 to 2:40)\n\nThere is a knock.\n\nYou open the door and there is a man standing there with his hat in his hands.\nYou know him by sight. He farms up the valley. He has never once spoken to you.\n\nHe does not come in. He does not look at your face.\n\nHe says his father died an hour ago. He says it happened fast, in the chair, no\nwarning. He says the priest could not get there in time.\n\nYou understand what he is telling you before he says it. The old man died\nwithout confessing. Whatever he did in eighty years of living, he took with him,\nunconfessed and unforgiven. His soul cannot rest. He will walk. He will come\nback down the lanes and stand in the meadows and his family will hear him at\nnight for the rest of their lives.\n\nUnless somebody takes it off him.\n\nThe farmer holds out his hand. There is a sixpence in it.\n\nSixpence is a week of eating.\n\nHe tells you what you have to do. You have to come to the house. They will bring\nthe body out and lay it on the bier in front of the door. They will pass a loaf\nof bread across the corpse and put it in your hands, and a wooden bowl of beer,\nand you will eat the bread and drink the beer where the whole village can watch\nyou do it.\n\nAnd when you swallow, everything the old man ever did becomes yours.\n\nYou look at the coin. You are so hungry.\n\nYou say yes.\n\n[PAUSE 1.2s]\n\n### ACT 3. THE FIRST TIME (2:40 to 5:00)\n\nThey have put a low stool outside the door for you. A cricket, they call it.\nYou sit on it facing the house, and you understand immediately that the stool is\nnot a kindness. It is so you do not have to come inside.\n\nThe body is on the bier. It is an old man with a beard gone yellow at the mouth.\nThere is a plate of salt on his chest.\n\nNobody talks to you. Twenty people are standing in that yard and not one of them\nlooks directly at you, and you realise they are not being rude. They are being\ncareful.\n\nA woman comes out with a loaf. She does not hand it to you. She passes it across\nthe body, over the dead man's chest, and only then does she let it go into your\nhands.\n\nThe bread is heavy and slightly damp.\n\nThen the bowl. Maple wood. Full of beer, right to the rim.\n\nSomebody says: now.\n\nYou eat.\n\n[PAUSE 0.8s]\n\nYou eat the whole loaf, standing in a farmyard in front of twenty silent people\nwho are watching your mouth. It is the most food you have had in a month, and\nit tastes like bread, whi
