:root{--bg:#0c0e0d;--pan:#141816;--pan2:#1a201d;--ln:#242b27;--ink:#eef3f0;

html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);

.app{display:flex;min-height:100vh}
.side{width:206px;flex-shrink:0;background:var(--pan);border-right:1px solid var(--ln);
padding:16px 11px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:18px;padding:0 5px}
.dot{width:25px;height:25px;border-radius:8px;background:var(--acc);flex-shrink:0}
.brand b{font-size:15px}
.navlab{color:var(--mut);font-size:10px;text-transform:uppercase;
letter-spacing:.11em;margin:15px 6px 6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:6px;
padding:9px 11px;border-radius:9px;color:var(--mut);cursor:pointer;

.nav:hover{background:var(--pan2);color:var(--ink)}

.nav.sub{font-size:12.5px;padding-left:20px}
.nav .n{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.main{flex:1;padding:18px 20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
margin-bottom:16px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.sub{color:var(--mut);font-size:11.5px}
.cols{display:grid;grid-template-columns:1fr 290px;gap:15px;align-items:start}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
margin-bottom:15px}
.card{background:var(--pan);border:1px solid var(--ln);border-radius:13px;padding:13px}
.card.click{cursor:pointer} .card.click:hover{border-color:var(--acc)}
.k{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em}
.v{font-size:24px;font-weight:700;margin-top:4px;line-height:1.15}
.v small{font-size:12px;color:var(--mut);font-weight:400}
.d{font-size:11px;margin-top:5px;color:var(--mut)}
.d.g{color:var(--acc)} .d.a{color:var(--amb)} .d.r{color:var(--bad)}
.bar{height:5px;background:var(--ln);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.panel{background:var(--pan);border:1px solid var(--ln);border-radius:13px;
padding:14px;margin-bottom:13px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
margin:0 0 9px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:10.5px;
text-transform:uppercase;letter-spacing:.07em;padding:0 6px 7px 0}
td{padding:7px 6px;border-top:1px solid var(--ln);font-variant-numeric:tabular-nums}
td:first-child{padding-left:0} tr.click{cursor:pointer}
tr.click:hover td{background:var(--pan2)}
.t{overflow-wrap:anywhere} .num{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:6px;
background:var(--pan2);color:var(--mut);border:1px solid var(--ln);margin-left:5px}
.tag.qc{color:var(--acc);border-color:#2a6b47}
.tag.dt{color:var(--amb);border-color:#5a4526}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.when{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums;
width:62px;flex-shrink:0}
.what{font-size:12.5px;min-width:0;overflow-wrap:anywhere}
svg.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.back{background:none;border:0;color:var(--acc);cursor:pointer;font-size:12.5px;
padding:0;margin-bottom:10px;font-family:inherit}
.foot{color:var(--mut);font-size:11px;margin-top:22px;line-height:1.7}
.stack{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:880px){
 .app{flex-direction:column}
 .side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:5px;
 padding:11px;border-right:0;border-bottom:1px solid var(--ln)}
 .brand{width:100%;margin-bottom:6px} .navlab{display:none}
 .nav{flex:1;justify-content:center;margin:0;min-width:104px}
 .nav.sub{padding-left:11px}
 .cols{grid-template-columns:1fr} .main{padding:14px 13px}
}

<script>
const D = window.__HQ__;
const $ = s => document.querySelector(s);
const fmt = n => (n||0).toLocaleString();
const mins = m => m>=60 ? (m/60).toFixed(1)+'h' : Math.round(m)+'m';
let view = {page:'yt', ch:null};

function chart(series, w=560, h=170){
  const keys = Object.keys(series);
  const all = keys.flatMap(k=>series[k].map(p=>p[1]));
  if(!all.length) return '<div class="sub">No history yet. A point is added '
    +'every time the dashboard rebuilds (3x daily).</div>';
  const mx = Math.max(...all, 1), pad = 26;
  const n = Math.max(...keys.map(k=>series[k].length), 2);
  let g='';
  [0,.5,1].forEach(f=>{const y=h-pad-(h-pad*2)*f;
    g+=`<line x1="${pad}" x2="${w-pad}" y1="${y}" y2="${y}" stroke="#242b27"/>`;});
  keys.forEach(k=>{
    const s=series[k]; if(s.length<2) {
      if(s.length===1){const x=pad,y=h-pad-(h-pad*2)*(s[0][1]/mx);
        g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${k==='qc'?'#3ddc84':'#ffb454'}"/>`;}
      return;}
    const pts=s.map((p,i)=>{
      const x=pad+(w-pad*2)*i/(n-1), y=h-pad-(h-pad*2)*(p[1]/mx);
      return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    g+=`<polyline fill="none" stroke="${k==='qc'?'#3ddc84':'#ffb454'}"
        stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>`;});
  g+=`<text x="${pad}" y="13" fill="#87938c" font-size="9">${fmt(mx)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${g}</svg>`;
}

function nextUp(limit=10){
  const out=[], now=new Date();
  let d=new Date(now); if(now.getHours()>=19) d.setDate(d.getDate()+1);
  const q=D.queue.items||[];
  for(let i=0;i<Math.min(q.length,limit*2);i+=2){
    const day=new Date(d); day.setDate(d.getDate()+i/2);
    q.slice(i,i+2).forEach(c=>out.push({d:day,t:'19:00',
      w:c.title,ch:c.ch.toUpperCase(),k:c.fmt}));
  }
  for(let k=0;k<21;k++){
    const day=new Date(now); day.setDate(now.getDate()+k);
    const wd=day.getDay();
    if(wd===1) out.push({d:day,t:'09:00',w:'Quiet Chain episode build',ch:'QC',k:'episode'});
    if(wd===4) out.push({d:day,t:'09:00',w:'Dead Trade episode build',ch:'DT',k:'episode'});
  }
  (D.social.carousels||[]).forEach(x=>out.push(
    {d:new Date(x.date+'T08:00'),t:'08:00',w:x.slug,ch:'LI',k:'carousel'}));
  (D.social.threads||[]).forEach(x=>out.push(
    {d:new Date(x.date+'T'+x.time),t:x.time,w:x.slug,ch:'TH',k:''}));
  return out.filter(x=>x.d>=new Date(now-72e5))
            .sort((a,b)=>a.d-b.d).slice(0,limit);
}

function rail(){
  const now=new Date();
  return `<div class="panel"><h2>Next up</h2>`+nextUp(10).map(x=>{
    const same=x.d.toDateString()===now.toDateString();
    const lab=same?'Today':x.d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
    const cl=x.ch==='QC'?'qc':(x.ch==='DT'?'dt':'');
    return `<div class="item"><div class="when">${lab}<br>${x.t}</div>
      <div class="what">${x.w.slice(0,40)}<span class="tag ${cl}">${x.ch}</span>
      ${x.k?`<span class="tag">${x.k}</span>`:''}</div></div>`;}).join('')+`</div>`;
}

function ytHome(){
  const c=D.channels;
  let h=`<div class="head"><div><h1>YouTube</h1><div class="sub">
    2 shorts daily 19:00 &middot; episodes Mon + Thu 09:00</div></div></div>`;
  h+=`<div class="kpis">`;
  c.forEach(ch=>{
    h+=`<div class="card click" onclick="go('yt','${ch.key}')">
      <div class="k">${ch.name}</div>
      <div class="v">${fmt(ch.short_views)}<small> shorts</small></div>
      <div class="d">${fmt(ch.long_views)} long-form &middot; ${ch.subs} subs</div>
      <div class="d g">${mins(ch.short_min)} + ${mins(ch.long_min)} watch</div></div>`;
  });
  const days=D.queue.days;
  h+=`<div class="card click" onclick="go('queue')"><div class="k">Shorts queue</div>
    <div class="v">${days}<small> days</small></div>
    <div class="d ${days>3?'':'r'}">${D.queue.pending} clips ready</div></div>`;
  h+=`<div class="card click" onclick="go('cost')"><div class="k">Total spend</div>
    <div class="v">$${D.cost_total.toFixed(0)}</div>
    <div class="d">${D.costs.length} episodes &middot; tap to break down</div></div>`;
  h+=`</div>`;
  h+=`<div class="cols"><div><div class="panel"><h2>Views per day</h2>
    ${chart(D.daily)}<div class="legend">
    <span><i style="background:#3ddc84"></i>Quiet Chain</span>
    <span><i style="background:#ffb454"></i>Dead Trade</span></div></div>`;
  c.forEach(ch=>{
    h+=`<div class="panel"><div class="head" style="margin-bottom:9px">
      <div><b>${ch.name}</b> <span class="sub">${ch.handle}</span></div>
      <button class="back" onclick="go('yt','${ch.key}')">Open &rarr;</button></div>
      <div class="stack">
      <div><div class="k">Shorts</div><div class="v" style="font-size:19px">
        ${fmt(ch.short_views)}</div><div class="d">${ch.short_n} videos &middot; ${mins(ch.short_min)}</div></div>
      <div><div class="k">Long-form</div><div class="v" style="font-size:19px">
        ${fmt(ch.long_views)}</div><div class="d">${ch.long_n} videos &middot; ${mins(ch.long_min)}</div></div>
      <div><div class="k">Subscribers</div><div class="v" style="font-size:19px">
        ${ch.subs}</div><div class="d">of 1,000 for YPP</div></div>
      </div></div>`;});
  h+=`</div><div>${rail()}</div></div>`;
  return h;
}

function ytChannel(key){
  const ch=D.channels.find(x=>x.key===key); if(!ch) return ytHome();
  const yppMin=4000*60;
  let h=`<button class="back" onclick="go('yt')">&larr; All channels</button>
    <div class="head"><div><h1>${ch.name}</h1>
    <div class="sub">${ch.handle} &middot; ${ch.promise}</div></div>
    <div class="sub">Builds ${ch.build_day}</div></div>`;
  h+=`<div class="kpis">
    <div class="card"><div class="k">Shorts views</div><div class="v">${fmt(ch.short_views)}</div>
      <div class="d">${ch.short_n} videos &middot; ${mins(ch.short_min)} watched</div></div>
    <div class="card"><div class="k">Long-form views</div><div class="v">${fmt(ch.long_views)}</div>
      <div class="d">${ch.long_n} videos &middot; ${mins(ch.long_min)} watched</div></div>
    <div class="card"><div class="k">Subscribers</div>
      <div class="v">${ch.subs}<small> / 1,000</small></div>
      <div class="bar"><i style="width:${Math.min(100,ch.subs/10)}%"></i></div></div>
    <div class="card"><div class="k">YPP watch hours</div>
      <div class="v">${(ch.long_min/60).toFixed(1)}<small> / 4,000</small></div>
      <div class="bar"><i style="width:${Math.min(100,ch.long_min/yppMin*100).toFixed(2)}%"></i></div>
      <div class="d a">long-form only, est. 50% retention</div></div></div>`;
  h+=`<div class="cols"><div>`;
  ['short','long'].forEach(kind=>{
    const v=ch.videos.filter(x=>x.kind===kind); if(!v.length) return;
    h+=`<div class="panel"><h2>${kind==='short'?'Shorts':'Long-form'} (${v.length})</h2>
      <table><tr><th>Video</th><th class="num">Views</th><th class="num">Likes</th>
      <th class="num">Watch</th><th class="num">Age</th></tr>`;
    v.forEach(x=>{h+=`<tr class="click" onclick="window.open('https://youtu.be/${x.id}')">
      <td class="t">${x.title.slice(0,44)}</td><td class="num">${fmt(x.views)}</td>
      <td class="num">${x.likes}</td><td class="num">${mins(x.est_min)}</td>
      <td class="num">${Math.round(x.hours)}h</td></tr>`;});
    h+=`</table></div>`;});
  h+=`<div class="panel"><h2>Upcoming episodes</h2><table>`;
  ch.slate.forEach((s,i)=>{h+=`<tr><td class="num" style="width:26px;color:#87938c">
    ${i+1}</td><td class="t">${s}</td></tr>`;});
  h+=`</table></div></div><div>${rail()}</div></div>`;
  return h;
}

function costPage(){
  let h=`<button class="back" onclick="go('yt')">&larr; Back</button>
    <div class="head"><div><h1>Cost breakdown</h1>
    <div class="sub">Counted from files on disk, not estimated</div></div>
    <div class="sub">Total $${D.cost_total.toFixed(2)}</div></div>`;
  h+=`<div class="panel"><table>
    <tr><th>Episode</th><th class="num">Min</th><th class="num">Images</th>
    <th class="num">Art</th><th class="num">VO</th><th class="num">SFX</th>
    <th class="num">Anim</th><th class="num">Total</th><th class="num">$/min</th></tr>`;
  D.costs.forEach(c=>{h+=`<tr><td class="t">${c.episode}
    <span class="tag ${c.channel}">${c.channel.toUpperCase()}</span></td>
    <td class="num">${c.minutes}</td><td class="num">${c.images}</td>
    <td class="num">$${c.img_cost.toFixed(2)}</td>
    <td class="num">$${c.vo_cost.toFixed(2)}</td>
    <td class="num">$${c.sfx_cost.toFixed(2)}</td>
    <td class="num" style="color:#3ddc84">$0.00</td>
    <td class="num"><b>$${c.total.toFixed(2)}</b></td>
    <td class="num">$${(c.total/Math.max(c.minutes,.1)).toFixed(2)}</td></tr>`;});
  h+=`</table></div>
  <div class="panel"><h2>Unit rates</h2><table>
   <tr><td>Image (nano-banana-pro)</td><td class="num">$0.150 each</td></tr>
   <tr><td>Voice (ElevenLabs Liam)</td><td class="num">$0.100 / 1k chars</td></tr>
   <tr><td>Sound effects</td><td class="num">$0.002 / second</td></tr>
   <tr><td>Animation (ffmpeg sprites)</td><td class="num" style="color:#3ddc84">free</td></tr>
  </table><div class="sub" style="margin-top:9px">
  Sprite compositing replaced AI video at $0.125 per 5s beat. On a 60-shot
  episode that alone was $7.50.</div></div>`;
  return h;
}

function queuePage(){
  let h=`<button class="back" onclick="go('yt')">&larr; Back</button>
    <div class="head"><div><h1>Shorts queue</h1>
    <div class="sub">2 per day at 19:00 &middot; same clip in both framings</div></div>
    <div class="sub">${D.queue.pending} clips &middot; ${D.queue.days} days</div></div>
    <div class="panel"><table><tr><th>#</th><th>Clip</th><th>Channel</th><th>Framing</th></tr>`;
  D.queue.items.forEach((c,i)=>{h+=`<tr><td class="num" style="color:#87938c">
    ${Math.floor(i/2)+1}</td><td class="t">${c.title}</td>
    <td><span class="tag ${c.ch}">${c.ch.toUpperCase()}</span></td>
    <td>${c.fmt}</td></tr>`;});
  return h+`</table></div>`;
}

function socialHome(){
  const s=D.social;
  let h=`<div class="head"><div><h1>Social</h1><div class="sub">
    LinkedIn + Instagram Mon/Wed/Fri/Sat &middot; Threads 2x daily</div></div></div>
    <div class="kpis">
    <div class="card click" onclick="go('social','car')"><div class="k">Carousels</div>
      <div class="v">${s.carousels.length}</div><div class="d">queued &middot; LinkedIn + IG</div></div>
    <div class="card click" onclick="go('social','th')"><div class="k">Threads</div>
      <div class="v">${s.threads.length}</div><div class="d">queued chains</div></div>
    <div class="card"><div class="k">Weekly cadence</div><div class="v">16<small> posts</small></div>
      <div class="d">3 LI + 3 IG + 10 TH</div></div>
    <div class="card"><div class="k">Queue ends</div>
      <div class="v" style="font-size:16px">${s.carousels.length?s.carousels[s.carousels.length-1].date:'-'}</div></div>
    </div><div class="cols"><div>`;
  h+=`<div class="panel"><h2>Carousels</h2><table>
    <tr><th>Date</th><th>Topic</th></tr>`;
  s.carousels.slice(0,14).forEach(x=>{h+=`<tr><td>${x.date} ${x.day}</td>
    <td class="t">${x.slug}</td></tr>`;});
  h+=`</table></div><div class="panel"><h2>Threads</h2><table>
    <tr><th>When</th><th>Topic</th></tr>`;
  s.threads.slice(0,14).forEach(x=>{h+=`<tr><td>${x.date} ${x.time}</td>
    <td class="t">${x.slug}</td></tr>`;});
  h+=`</table></div></div><div>${rail()}</div></div>`;
  return h;
}

function nav(){
  const n=[];
  n.push(`<button class="nav ${view.page==='yt'&&!view.ch?'on':''}"
    onclick="go('yt')">YouTube</button>`);
  D.channels.forEach(c=>n.push(`<button class="nav sub ${view.ch===c.key?'on':''}"
    onclick="go('yt','${c.key}')">${c.name}
    <span class="n">${fmt(c.short_views+c.long_views)}</span></button>`));
  n.push(`<div class="navlab">Social</div>`);
  n.push(`<button class="nav ${view.page==='social'?'on':''}"
    onclick="go('social')">All platforms</button>`);
  n.push(`<div class="navlab">Ops</div>`);
  n.push(`<button class="nav ${view.page==='queue'?'on':''}"
    onclick="go('queue')">Shorts queue <span class="n">${D.queue.days}d</span></button>`);
  n.push(`<button class="nav ${view.page==='cost'?'on':''}"
    onclick="go('cost')">Costs <span class="n">$${D.cost_total.toFixed(0)}</span></button>`);
  return n.join('');
}

function render(){
  $('#nav').innerHTML=nav();
  let h;
  if(view.page==='yt') h = view.ch?ytChannel(view.ch):ytHome();
  else if(view.page==='social') h = socialHome();
  else if(view.page==='cost') h = costPage();
  else if(view.page==='queue') h = queuePage();
  $('#main').innerHTML = h + `<div class="foot">
    Updated ${D.generated.slice(0,16).replace('T',' ')} Brunei &middot;
    rebuilds 08:15, 13:15, 21:15.<br>
    Watch time is estimated at 50% retention until YouTube Analytics
    backfills (24-48h lag). No tokens are stored in this page.</div>`;
  window.scrollTo(0,0);
}
function go(page,ch){ view={page,ch:ch||null};
  history.replaceState(null,'','#'+page+(ch?'/'+ch:'')); render(); }
window.go=go;
(function(){const m=(location.hash||'#yt').slice(1).split('/');
  view={page:m[0]||'yt',ch:m[1]||null}; render();})();
</script>
</body></html>
