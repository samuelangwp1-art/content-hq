ch is somehow the worst part. Some part of you expected\nit to taste like something. To burn. To fight going down.\n\nIt is just bread. You are so hungry that you almost enjoy it.\n\nYou drink the beer in one draught because that is how it is done.\n\nThen you stand up off the stool and you say the words they told you to say, and\nyour voice comes out strange because you have not spoken to a group of people in\na very long time:\n\n> I give easement and rest now to thee, dear man, that ye walk not down the\n> lanes or in our meadows. And for thy peace I pawn my own soul.\n\nI pawn my own soul.\n\nYou have just said that out loud, in front of witnesses, for sixpence.\n\n[PAUSE 1.1s]\n\nThe farmer puts the coin in your hand. He does it without touching you. Then he\nturns around and goes back to his family, and you are standing alone in a yard\nfull of people who are already forgetting you are there.\n\nYou walk home. You are full. You have money.\n\nThat night you sleep better than you have slept in months, and you wake up\nfeeling completely normal, and this is the first thing that frightens you.\n\nBecause if it did not work, you have robbed a grieving family.\n\nAnd if it did work, it is inside you now.\n\n### ACT 4. THE MARK (5:00 to 8:00)\n\nThe next morning you go down to the village for salt.\n\nThe shopkeeper serves you. He is polite. He puts your change on the counter\ninstead of into your hand.\n\nYou do not think anything of it. Not that day.\n\nThree weeks later you understand.\n\nA boy is playing in the road ahead of you. His mother comes out, takes his arm,\nand pulls him inside. Not fast, not frightened. The way you would move a child\naway from a dog you do not know.\n\nThen it starts happening everywhere. The seat next to you at the alehouse stays\nempty. Someone crosses the road. Someone changes what they were about to say\nwhen you walk in.\n\nHere is the thing nobody tells you before you take the bread.\n\nThe village believes it worked.\n\nThat is the whole problem. They are not shunning you because they think you are\na fraud. They are shunning you because they think you succeeded. They believe\nthat on that night in that yard, an old man's sins went out of him and into you,\nand that you are still carrying them.\n\nAnd why would they sit next to that?\n\nBy winter you are living further out. Not because anyone told you to. Because\nthe walk into the village stopped being worth it.\n\n[PAUSE 0.9s]\n\nThere is a law about people like you.\n\nTwenty four years before that night in the yard, Parliament passed the\nSettlement Act. It says a parish is only responsible for its own. A man who\ncannot prove he belongs to a place can be picked up and carried back to\nwherever he came from, whether anyone there wants him or not.\n\nSo you cannot leave. Not really. You could walk to the next valley, and the\nnext valley would put you in a cart and send you home. Wherever you go, you\nare Hereford's problem, and Hereford has decided what you are.\n\nThe village does not need to drive you out. The law already fenced you in.\n\nYou start to notice the shape of your own week. You know which path avoids the\ngreen. You know the hour the alehouse is thin. You know without deciding it\nthat you take the long way round the churchyard, because the churchyard is\nwhere people stand and talk after a burial, and standing near people who are\ntalking is not something you do now.\n\nNobody taught you these routes. You built them one small avoidance at a time,\nand you did not notice you were building them until they were the only ways\nyou walked.\n\n[PAUSE 0.8s]\n\nYou learn later that they burn the bowl.\n\nThe maple bowl you drank from, and the wooden platter the bread sat on. After\nyou leave, they take them out and put them on the fire. Every time.\n\nThe bread was food. The beer was drink. But the bowl touched your mouth, and the\nbowl cannot be used again.\n\nYou spent an evening as the most important man in that yard. The one person who\ncould give an old man rest. And they burned the cup you drank from before your\nfootprints were cold.\n\nThere is one more thing about the bowl, and you work it out slowly, over years.\n\nSomebody has to make a new one.\n\nEvery time you are sent for, a family buys or carves a fresh maple bowl and a\nfresh wooden platter, knowing it will be on the fire by morning. They are not\ndoing that out of superstition alone. They are paying twice. Sixpence to you,\nand the cost of the vessel that has to be destroyed because you touched it.\n\nThey think you are worth that. They think being free of the old man's sins is\nworth a coin and a bowl and a plate.\n\nYou never once got to keep the bowl.\n\n### ACT 5. THE TRADE (8:00 to 11:00)\n\nThe second time is easier.\n\nIt is easier because you already know how it goes, and because you have been\nhungry for two weeks, and because there is no longer anything to protect. You\ncannot be shunned twice.\n\nThe third time, they send a boy to fetch you and the boy already knows your\nname. Not your name. What you are.\n\nYou become the sin eater of the district. Not a job you applied for. A thing\npeople started calling you, and then it was true.\n\nThey come at night, mostly. A knock, a hat in the hands, a sixpence. Always the\nsame conversation, and it is always short, because nobody wants to spend time\ntalking to you if they can help it.\n\nYou get good at it. There is a way of holding the bowl so your hands do not\nshake in front of a crowd. There is a way of saying the words so they land, so\nthe widow's shoulders come down, so the family can finally cry.\n\nThat part is real. You have watched it happen dozens of times now. A woman who\nhas been rigid for three days will hear you say I pawn my own soul and something\nwill go out of her, and she will start weeping properly, and afterwards she will\nsleep.\n\nYou are not nothing. You are the reason these people can bury their dead and\ncarry on.\n\nYou are also the reason they will not let their children walk past your house.\n\nBoth of those are true at the same time, and you have stopped trying to make\nthem fit together.\n\n[PAUSE 1.0s]\n\nThe stories start around the fourth year.\n\nYou hear them secondhand, the way you hear everything now. That you keep company\nwith things that are not people. That you know words. That the reason you live\nout on the edge is not poverty.\n\nNone of it is true. You live out on the edge because they put you there.\n\nBut you notice something, and this is the part you are least proud of.\n\nYou do not correct them.\n\nBecause a man who is merely poor gets nothing. A man who is dangerous gets sent\nfor. The stories are bad for you and they are also the only reason the knocks\nkeep coming, and the knocks are the only reason you eat.\n\nSo you let them talk.\n\nYou feed it, a little. You do not smile in the village. You let the silence sit\nwhen someone asks you a question.\n\nYou have started making yourself into the thing they are afraid of, because the\nthing they are afraid of is the only thing they will pay for.\n\n[PAUSE 0.9s]\n\nThen there is a winter where nobody dies.\n\nYou did not know that could happen. Four months, a whole parish, and not one\nknock. The old survive it. The children survive it. Nothing goes wrong in any\nhouse in the valley, and you sit in your one room and understand that you are\na man whose eating depends on other people's grief.\n\nYou catch yourself listening for the bell.\n\nNot hoping. You want to be clear about that, because you have gone over this\nmore times than you will ever admit. You are not hoping anyone dies.\n\nBut you are listening. Every day, for four months, some part of you is turned\ntoward the village waiting for the sound that means bread.\n\nThat is what the trade did to you. Not the sins. The waiting.\n\n[PAUSE 1.0s]\n\nThere is one more thing you learn, and it comes from a woman at a gate who is\nkind to you by accident.\n\nShe asks after your family.\n\nIt is an ordinary question. She has forgotten for a second what you are, and\nshe asks it the way anyone asks it, and you have to stand there and work out\nwhat to say, because the true answer is that you do not have one and you are\nnot going to.\n\nNo woman in this valley will marry the sin eater. No family will let their\ndaughter live in the house on the edge with the man who carries other people's\ndead. And if by some accident there were a child, the child would be the sin\neater's child, and the village would know it, and it would follow them into\nwhatever life they tried to build.\n\nYou had thought the price was being alone now.\n\nStanding at that gate you understand it is bigger than that. The price is\neverything that was ever going to come after you. There is no version of your\nlife with anyone else in it. That was sold in a farmyard, in one swallow, for\nsixpence, before you were old enough to know what you were selling.\n\nShe realises what she has asked. You watch it arrive on her face.\n\nShe says she is sorry, and she means it, and that is somehow worse than the\ncrossing of the road.\n\n### ACT 6. THE POINT OF NO RETURN (11:00 to 13:30)\n\nA boy comes up the path in the rain.\n\nHe is maybe fourteen. He is soaked through and he will not come closer than the\ngate.\n\nHe says his mother is dead. He says it happened in the night. He says there is\nno money in the house but the loaf is ready.\n\nYou know this family. You knew this woman, slightly, from before. She was one of\nthe ones who used to nod at you on the road, back when people did that.\n\nYou go.\n\nThe house is very small and there are three younger children in it and nobody\nelse. No father. No grandmother. Nobody standing in the yard, because there is\nno yard, and there is nobody to fill it.\n\nThey bring her out on a board. The boy passes you the bread across his mother's\nbody, and his hands are shaking so hard that the loaf nearly goes into the mud,\nand you steady it, and for one second your fingers touch his.\n\nHe does not pull away.\n\nHe is the first person who has touched you in four years.\n\n[PAUSE 1.3s]\n\nYou eat the bread in the rain with four children watching you.\n\nYou say the words. And when you get to I pawn my own soul, the boy says amen,\nout loud, alone, the only voice in that yard, and you have to stop for a moment\nbefore you can finish.\n\nThere is no sixpence. You knew that walking up the path.\n\nYou go home hungry, and you sit in your one room, and here is what you finally\nunderstand.\n\nYou always thought you were being paid to eat the sins. You were not. Anyone can\neat bread.\n\nYou were being paid to be the one who is not clean. Somebody has to be. So the\nrest of them can carry their dead to the churchyard and know that the wrong is\nsomewhere else now, standing outside, sitting on a low stool, walking home in\nthe dark.\n\nThey did not hire your stomach.\n\nThey hired your place in the world. And you sold it. For sixpence, on a night\nwhen you were hungry, before you knew what it was worth.\n\n### ACT 7. THE TRAPDOOR (13:30 to 15:30)\n\nNow the part that is real, and documented, and stranger than any of it.\n\nIn 1870, in a village called Ratlinghope in Shropshire, a farmer named Richard\nMunslow lost three of his children in a single week to scarlet fever.\n\nMunslow was not poor. He was not an outcast. He was a landowner from an\nestablished family. He had everything the man on the road never had.\n\nAnd after his children died, Richard Munslow revived the practice of sin eating\nin his parish. He took it up himself, a wealthy man doing a beggar's work,\neating the sins of his neighbours' dead for no reason anyone has ever\nsatisfactorily explained.\n\nHe did it until he died in 1906. He is buried in the churchyard at St Margaret's,\nand he is the last known sin eater in England.\n\nThink about what that means.\n\nEvery sin eater before him was doing it to eat. Munslow already had food. He\nwalked into it on purpose, knowing exactly what it would cost him socially,\nafter three small coffins came out of his house in seven days.\n\nNobody wrote down why.\n\nThe most likely answer is the one nobody likes. That his children died without\nlast rites, and there was no one to give them easement, and a father who could\nnot save them decided he would at least be the man who did it for everyone\nelse's children afterwards.\n\nHe pawned his own soul, out loud, in a churchyard, for thirty six years.\n\n[PAUSE 1.5s]\n\nIn 2010 the village raised a thousand pounds to restore his grave. There was a\nservice. The vicar, Norman Morris, said it was a very odd practice that the\nchurch would not have approved of, and that he had no desire to bring it back.\n\nThey fixed the stone of the last man who ever did it.\n\nAnd then they went home, the way everybody always did.\n\n### CLOSING (15:30 to 16:00)\n\nThe bread was real. The beer was real. The sixpence was real.\n\nWhether anything moved from that old man into you on that night in 1686, nobody\ncan tell you. Not the church, which looked the other way. Not the folklorists,\nwho arrived a century too late and found only stories.\n\nBut the village believed it. That was enough to make it true in every way that\ntouched your life.\n\nYou gave a hundred families the thing they could not give themselves. You let\nthem sleep. You let them bury their dead without fear.\n\nYou spent your whole life carrying other people's sins so they could rest.\n\nNobody is coming to carry yours.\n\n---\n\n## PRODUCTION SPEC\n\n**Runtime: 17.1 minutes.** MEASURED, not estimated: 3,133 spoken words at\nLiam's measured 185.7 wpm = 16.9 min, plus 11 pauses totalling 11.5s.\n\n**VOICE LOCKED: Liam @ speed 1.18** (md5 213f22e7). Already the default in\n`vo.py` lines 35-36, no change needed.\n\n**Word count: 3,133.** Expanded from 2,425 because Liam runs fast. The 708\nadded words went into acts 4 and 5, where isolation should accumulate slowest.\n\n**Shot count at 17.1 min:** ~370 shots at 2.2s median. At the measured 1.85x\nreuse ratio that is ~200 plates.\n\n**Cuts:** 21 to 22 per minute, about 340 shots. Median hold 2.2 seconds. Nothing\nunder 1 second except deliberate impact frames. Keep the cut rate flat. Do not\nspeed up into act 7.\n\n**Long holds over 4 seconds, 15% of shots, reserved for:** the coin in the open\npalm, the bread going into the mouth, the empty seat at the alehouse, the boy's\nhand on yours, the three small coffins, the restored gravestone.\n\n### Measured pauses, longest at the turns\n\n| after line | length | why |\n|---|---|---|\n| boots on the path | 1.0s | act turn |\n| you say yes | 1.2s | first compromise |\n| you eat | 0.8s | let it land |\n| I pawn my own soul | 1.1s | the contract |\n| the walk stopped being worth it | 0.9s | before the Settlement Act |\n| the only ways you walked | 0.8s | before the bowl |\n| you never got to keep the bowl | 1.0s | end of act 4 |\n| the only thing they will pay for | 0.9s | before the dead winter |\n| the waiting | 1.0s | before the woman at the gate |\n| he does not pull away | 1.3s | the touch |\n| for thirty six years | 1.5s | longest pause in the video, at 93% |\n\n11 pauses, 11.5s total.\n\nThe 1.5s at 93% is the Hypothetically move exactly. Longest silence goes on the\nreveal, not the ending.\n\n### Sound map\n\nMix to about -21 LUFS integrated so single cues feel loud. Cue positions as\npercent of runtime:\n\n`4, 7, 17, 30, 33, 47, 52, 55, 58, 62, 88, 91, 94, 97, 100`\n\n- 4 and 7: the knock, and the coin. Then nothing.\n- 17: bread and beer, single low swell, out before the speech ends\n- 30 to 33: the boy pulled inside, the bowl burning\n- 47 to 62: the trade cluster, low drone under the stories\n- **62 to 88: no cues at all.** 26% of the runtime completely dry. This is what\n  makes act 7 hit.\n- 88 to 100: Munslow. Bring music back at \"three of his children in a single\n  week\" and hold it under to the end.\n\nDiegetic only, sparse: boots on gravel, a knock, wood on wood, fire, rain. No\norchestral stings. Silence is the instrument.\n\n### Art direction\n\nMarker sketch, existing `style_anchor` pipeline. Faces stay blank so the viewer\ncan wear them.\n\nPalette by act: cold grey blue for the road and the cottage, warm amber only\ninside the farmhouse and only in act 3, then grey again and colder each act,\nback to warm amber once for the Munslow section.\n\nOne saturated accent in the entire video: **the sixpence**. It is the only warm\nmetal that appears. It shows in act 2 in the palm, and it does not appear again\nuntil you notice its absence in act 6 when there is no coin.\n\n### Open loops planted\n\n1. Why does the bowl get burned? Asked at 3:20, answered at 7:10.\n2. Did it actually work? Raised at 4:50, never resolved, deliberately.\n3. Who was the last one? Teased in the first 40 seconds by the on-screen date,\n   paid off at 13:30 with Munslow.\n\n---\n\n## PACKAGING\n\n**Title:** What It's Like to Be a Sin Eater\nThe series format is \"What It's Like to Be a ___\". It promises experience, not\ninformation.\n\n**Thumbnail:** a hand holding a loaf of bread across a covered body, marker\nsketch, blank faces, single warm coin visible. Text: SIN EATER. Nothing else.\n\n**Series, next five, all historical, no living people:**\n1. Sin Eater\n2. Resurrectionist (body snatcher, Edinburgh 1820s)\n3. Knocker Up (paid to wake the factories, Britain to the 1950s)\n4. Whipping Boy (beaten for a prince's mistakes)\n5. Leech Collector (women who waded in ponds and used their own legs as bait)\n6. Executioner's Assistant\n\nSame structure every episode: ordinary competence, intrusion, first compromise,\nthe mark, the trade, the point of no return, the trapdoor, one real historical\nperson at the end.\n\n**Description sources, all verified this session:**\n\n- John Aubrey, *The Remaines of Gentilisme and Judaisme* (1686 to 1687,\n  published 1881 by the Folk-Lore Society). Earliest account. The Ross high way\n  cottage, the loaf passed over the corpse, the maple mazer bowl of beer, the\n  sixpence, and the phrase \"freed him from walking after they were dead\".\n- John Bagford (c. 1650 to 1716), *Letter on Leland's Collectanea* i.76, cited\n  in Brewer's *Dictionary of Phrase and Fable* (1898). The low stool called a\n  cricket, the groat, the crust, the ale drunk in one draught, and the phrase\n  \"for which he would pawn his own soul\".\n- Catherine Sinclair (1838), on the practice in Monmouthshire and the western\n  counties, in decline but still current.\n- Bertram S. Puckle, *Funeral Customs* (1926), chapter IV. Professor Evans of\n  the Presbyterian College, Carmarthen, who reported seeing a sin eater near\n  Llanwenog, Cardiganshire, around 1825, living apart and avoided \"as they would\n  a leper\", with the bowl and platter burned afterwards.\n- *Encyclopaedia Britannica* (1911), on the 1893 Market Drayton funeral biscuit\n  and on burial cakes surviving in Lincolnshire and Cumberland.\n- Ella Mary Leather, *The Folklore of Herefordshire* (1912).\n- E. Sidney Hartland, *Folklore* V (1892).\n- Richard Munslow (1832 to 1906), Ratlinghope, Shropshire. Wealthy farmer,\n  believed to be the last sin eater in England. Lost three children in one week\n  to scarlet fever in 1870. Grave at St Margaret's restored in 2010 after\n  villagers raised one thousand pounds. Service led by Reverend Norman Morris.\n  Source: BBC News, 24 September 2010, and the BBC A History of the World entry\n  for the Sin Eater's Grave, Ratlinghope.\n- The speech text, \"I give easement and rest now to thee, dear man, that ye walk\n  not down the lanes or in our meadows. And for thy peace I pawn my own soul.\n  Amen.\" Recorded in association with Munslow and the Marches practice.\n\n**Disclaimer for the description:**\n\n> This video is a dramatisation. The ritual, the objects, the payment, the\n> speech and the social consequences are drawn from the sources listed above.\n> The narrator is a composite figure, not a specific historical individual, with\n> the exception of Richard Munslow, who was real and whose details are as\n> recorded. Where the record is silent, the video says so.\n\n**AI disclosure:** the visuals are stylised illustration, not realistic\nsynthetic footage of real people, so the altered or synthetic content toggle\ndoes not apply to depictions of real individuals. Disclose generative use in\nYouTube Studio anyway. It costs nothing and the policy is tightening in 2026.\n\n**No living people appear.** Nothing in this episode or the next five touches a\nliving public figure, which keeps it clear of both the YouTube likeness policy\nand Brunei's Sedition Act.\n\n**Ending card:** no comment gate. Series card only, listing the next episode.","lines":395,"built":true},{"title":"Ancient Sleep","ch":"dt","body":"# How Did Ancient Humans Sleep?\n\n## ACT 1\n\nYou wake up at two in the morning and you cannot get back to sleep.\n\nYou lie there. You check the time. You do the maths on how many hours you have left and the answer is never good enough.\n\nSomewhere in your head is the idea that you have failed at something. That a proper night is eight hours in one unbroken block, and you just broke it.\n\nFor most of human history, nobody thought that.\n\nWaking in the middle of the night was not a problem. It was the middle of the night. It had a name.\n\n## ACT 2\n\nHere is what the record actually shows.\n\nA historian called Roger Ekirch spent sixteen years going through diaries, court records, medical books and letters from before industrial lighting. He found more than five hundred references to something he had never been taught existed.\n\nPeople went to sleep. They woke a few hours later. They stayed awake for one or two hours. Then they slept again until morning.\n\nThey called them first sleep and second sleep. In English documents the phrase appears without any explanation, the way you would write breakfast. Nobody defined it because everybody had one.\n\nThe gap between them had its own character. Ekirch found people praying in it, talking to whoever was next to them, checking animals, having sex, thinking about the dream they had just come out of.\n\nA French doctor in the sixteenth century advised that the hour after first sleep was the best time to conceive a child, because the couple would have more energy and more enjoyment than they would at bedtime.\n\nThat is a medical opinion written for a world where two sleeps were normal.\n\n## ACT 3\n\nThe question is what a sleeping place actually looked like.\n\nNot a bedroom. Most people did not have one.\n\nA house was one room, sometimes two. The fire was the centre of it and the fire was the reason to be near the middle. Beds were where the warmth was, and everybody shared.\n\nIn a typical rural household, you slept with your family, your servants if you had any, and travellers who had asked to stay. This was not considered intimate. It was considered practical.\n\nSamuel Pepys wrote about sharing a bed with strangers on the road in the sixteen sixties and treated it the way you would treat sharing a train carriage.\n\nThe mattress under you depended on what you could afford. Straw at the bottom of the scale, changed when it went sour. Then flock, which was shredded wool and rag. Then feathers, which were expensive enough to appear in wills.\n\nYou did not lie flat. Beds across medieval and early modern Europe were built with the head raised, and people slept propped up. There is no single agreed reason. Warmth is one theory. Breathing is another. What is certain is that the flat sleeping position we treat as natural is not what most of these beds were built for.\n\n## ACT 4\n\nThen there is the thing you cannot see in a photograph of a reconstructed cottage.\n\nIt was dark. Genuinely dark.\n\nA candle was a cost. A poor household burned rushlights, which were reeds soaked in fat, and a rushlight gives you a weak flame for maybe twenty minutes. Nobody lit one to read at midnight.\n\nSo the night was long. In a northern winter you could have sixteen hours between sunset and sunrise, and no way to fill them except sleep.\n\nThat is the missing piece. Segmented sleep is not a strange habit. It is what happens when you put a person in the dark for sixteen hours. They sleep, they surface, they lie there, they sleep again.\n\nIn nineteen ninety two a psychiatrist named Thomas Wehr tested it. He took volunteers, gave them fourteen hours of darkness a night, and waited.\n\nWithin about four weeks their sleep split in two. Two blocks, with a gap of one to three hours in the middle. Nobody told them to do it.\n\nTheir hormones changed in the gap. Prolactin, which is associated with a calm resting state, stayed elevated. The subjects described the waking period as quiet and pleasant rather than distressing.\n\nThey had reproduced a seventeenth century night in a laboratory, using nothing but darkness.\n\n## ACT 5\n\nSleep was also not safe.\n\nYou were in a wooden building with an open fire, and fire was the constant risk. In many towns there was a curfew bell, and the word itself comes from couvre feu, meaning cover the fire. When it rang, you banked the embers.\n\nThere were bugs. Bedbugs and fleas were normal, not a scandal. Bedding was beaten, aired, and sometimes smoked.\n\nAnd there were people. Doors were barred, and in some households one person stayed up. The night watch existed because the night was understood to be dangerous.\n\nIf you woke at two, you were not alone in the dark. Others were awake too. That was part of why it was tolerable.\n\n## ACT 6\n\nSo what ended it.\n\nNot one thing. Light, mostly.\n\nStreet lighting spread through European cities in the seventeenth and eighteenth centuries. Gas came in the eighteen hundreds. Then electricity.\n\nThe night stopped being empty. You could work in it, drink in it, walk in it. Being awake at midnight went from ordinary to a sign that something was wrong with you.\n\nEkirch traced the references to first sleep fading out of writing across the eighteen hundreds. By nineteen twenty the phrase is essentially gone. Within a couple of generations, a thing everybody did became a thing nobody had heard of.\n\nThe eight hour block is not ancient. It is roughly as old as the light bulb.\n\n## ACT 7\n\nWhich brings it back to two in the morning.\n\nWaking in the night is not proof that your sleep is broken. For most of the time there have been humans, it was the shape of the night.\n\nWhat changed is not your body. What changed is that you now have a clock beside you, a phone that lights up, and a fixed hour you are supposed to be at work.\n\nThe distress is modern. The waking is not.\n\nTomorrow night, if you surface at two and lie there in the dark, you are doing something people did for thousands of years and had a name for.\n\nThey just did not reach for their phone.","lines":45,"built":true}],"daily":{"qc":[["2026-09-05",3673],["2026-09-06",3747]],"dt":[["2026-09-05",362],["2026-09-06",379]]}};</script>
<script>
const D = window.__HQ__;
const $ = s => document.querySelector(s);
const esc = t => String(t||'').replace(/&/g,'&amp;')
  .replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = n => (n||0).toLocaleString();
const mins = m => m>=60 ? (m/60).toFixed(1)+'h' : Math.round(m)+'m';
let view = {page:'yt', ch:null};

/* ---------------------------------------------------------- APPROVAL GATE
   Standing rule from Samuel: "hold every post for approval before posting."
   GitHub Pages is STATIC - there is no server here to write to. So a
   decision is stored locally AND opened as a prefilled GitHub issue, which
   is the channel the pipeline actually reads. Local state gives instant
   feedback; the issue is the durable record.
   FAIL CLOSED: anything not explicitly approved is treated as not approved. */
const AP_REPO='samuelangwp1-art/content-hq';
function apGet(){ try{ return JSON.parse(localStorage.getItem('hq_ap')||'{}'); }
                  catch(e){ return {}; } }
function apSet(o){ try{ localStorage.setItem('hq_ap',JSON.stringify(o)); }catch(e){} }
function apState(slug){ return (apGet()[slug]||{}).v || ''; }

function apBadge(slug){
  const v=apState(slug);
  if(v==='y') return '<span class="tag ok">approved</span>';
  if(v==='n') return '<span class="tag no">rejected</span>';
  return '<span class="tag wait">needs approval</span>';
}

function apButtons(slug){
  if(!slug) return '';
  const v=apState(slug);
  return `<div class="aprow">
    <button class="apbtn y ${v==='y'?'on':''}" onclick="apMark('${slug}','y')">Approve</button>
    <button class="apbtn n ${v==='n'?'on':''}" onclick="apMark('${slug}','n')">Reject</button>
    <span class="apnote">${v==='y'?'will publish'
      :v==='n'?'held back':'nothing publishes until you approve'}</span>
  </div>`;
}

function apMark(slug,v){
  const o=apGet();
  o[slug]={v:v, at:new Date().toISOString().slice(0,16)};
  apSet(o);
  render();
  /* record it where the pipeline can see it */
  const title=encodeURIComponent((v==='y'?'approve ':'no ')+slug);
  const body=encodeURIComponent((v==='y'?'approve ':'no ')+slug+'\n\nfrom Content HQ');
  window.open(`https://github.com/${AP_REPO}/issues/new?title=${title}&body=${body}`,'_blank');
}

function chart(series, w=560, h=170){
  const keys = Object.keys(series);
  const all = keys.flatMap(k=>series[k].map(p=>p[1]));
  if(!all.length) return '<div class="sub">No history yet. A point is added '
    +'every time the dashboard rebuilds (3x daily).</div>';
  const mx = Math.max(...all, 1), pad = 26;
  const n = Math.max(...keys.map(k=>series[k].length), 2);
  let g='';
  [0,.5,1].forEach(f=>{const y=h-pad-(h-pad*2)*f;
    g+=`<line x1="${pad}" x2="${w-pad}" y1="${y}" y2="${y}" stroke="#242b27"/>`;});
  keys.forEach(k=>{
    const s=series[k]; if(s.length<2) {
      if(s.length===1){const x=pad,y=h-pad-(h-pad*2)*(s[0][1]/mx);
        g+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${k==='qc'?'#3ddc84':'#ffb454'}"/>`;}
      return;}
    const pts=s.map((p,i)=>{
      const x=pad+(w-pad*2)*i/(n-1), y=h-pad-(h-pad*2)*(p[1]/mx);
      return x.toFixed(1)+','+y.toFixed(1);}).join(' ');
    g+=`<polyline fill="none" stroke="${k==='qc'?'#3ddc84':'#ffb454'}"
        stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>`;});
  g+=`<text x="${pad}" y="13" fill="#87938c" font-size="9">${fmt(mx)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${g}</svg>`;
}

function nextUp(limit=10, only){
  // only: 'qc' | 'dt' | 'social' | undefined (everything)
  const out=[], now=new Date();
  let d=new Date(now); if(now.getHours()>=19) d.setDate(d.getDate()+1);
  const q=D.queue.items||[];
  for(let i=0;i<q.length;i+=2){
    const day=new Date(d); day.setDate(d.getDate()+i/2);
    const pair=q.slice(i,i+2); if(!pair.length) continue;
    // ONE row per day: the crop and full versions are the SAME clip, so
    // listing both looked like a duplicate entry.
    out.push({d:day,t:'19:00',w:pair[0].title,ch:pair[0].ch.toUpperCase(),
      k:pair.map(x=>x.fmt).join('+'),kind:'short',body:''});
  }
  // episode builds carry the SCRIPT so it is readable right here
  const scriptFor=n=>(D.scripts||[]).find(s=>!s.built&&s.ch===n);
  for(let k=0;k<21;k++){
    const day=new Date(now); day.setDate(now.getDate()+k);
    const wd=day.getDay();
    [[1,'qc','QC'],[4,'dt','DT']].forEach(([dow,key,tag])=>{
      if(wd!==dow) return;
      const sc=scriptFor(key);
      const chn=(D.channels||[]).find(c=>c.key===key);
      let body='', label;
      if(sc){ label='Build: '+sc.title; body=sc.body; }
      else { label=(chn?chn.name:tag)+' episode build';
        // no script written yet - show the slate so the row still says
        // WHAT is coming, instead of being a dead line
        body=chn&&chn.slate&&chn.slate.length
          ? 'No script written yet. Next topics on the slate:\n\n'
            +chn.slate.map((t,i)=>(i+1)+'. '+t).join('\n')
          : ''; }
      out.push({d:day,t:'09:00',w:label,ch:tag,k:'episode',kind:'episode',body:body});
    });
  }
  (D.social.carousels||[]).forEach(x=>out.push(
    {d:new Date(x.date+'T08:00'),t:'08:00',w:x.slug,ch:'LI',k:'carousel',
     kind:'social',body:(x.body||'')+(x.ig?'\n\n--- INSTAGRAM ---\n\n'+x.ig:'')}));
  (D.social.threads||[]).forEach(x=>out.push(
    {d:new Date(x.date+'T'+x.time),t:x.time,w:x.slug,ch:'TH',k:'',
     kind:'social',body:(x.chain&&x.chain.length?x.chain.join('\n\n———\n\n'):x.text||'')}));
  let list=out.filter(x=>x.d>=new Date(now-72e5));
  if(only==='qc') list=list.filter(x=>x.ch==='QC');
  else if(only==='dt') list=list.filter(x=>x.ch==='DT');
  else if(only==='social') list=list.filter(x=>x.kind==='social');
  return list.sort((a,b)=>a.d-b.d).slice(0,limit);
}

function rail(only,title){
  const now=new Date();
  const items=nextUp(only?14:10, only);
  if(!items.length) return `<div class="panel"><h2>${title||'Next up'}</h2>
    <div class="sub">Nothing scheduled.</div></div>`;
  return `<div class="panel"><h2>${title||'Next up'}</h2>`+items.map(x=>{
    const same=x.d.toDateString()===now.toDateString();
    const lab=same?'Today':x.d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'});
    const cl=x.ch==='QC'?'qc':(x.ch==='DT'?'dt':'');
    const tags=`<span class="tag ${cl}">${x.ch}</span>`+(x.k?`<span class="tag">${x.k}</span>`:'');
    // anything WITH copy opens in place - that is the point of Next up
    if(x.body) return `<details class="draft"><summary>
      <span class="when">${lab} ${x.t}</span>
      <span class="what">${esc(x.w).slice(0,40)}${tags}</span></summary>
      <pre>${esc(x.body)}</pre></details>`;
    return `<div class="item"><div class="when">${lab}<br>${x.t}</div>
      <div class="what">${esc(x.w).slice(0,40)}${tags}</div></div>`;}).join('')+`</div>`;
}

function ytHome(){
  const c=D.channels;
  let h=`<div class="head"><div><h1>YouTube</h1><div class="sub">
    2 shorts daily 19:00 &middot; episodes Mon + Thu 09:00</div></div></div>`;
  h+=`<div class="kpis">`;
  c.forEach(ch=>{
    h+=`<div class="card click" onclick="go('yt','${ch.key}')">
      <div class="k">${ch.name}</div>
      <div class="v">${fmt(ch.short_views)}<small> shorts</small></div>
      <div class="d">${fmt(ch.long_views)} long-form &middot; ${ch.subs} subs</div>
      <div class="d g">${mins(ch.short_min)} + ${mins(ch.long_min)} watch</div></div>`;
  });
  const days=D.queue.days;
  h+=`<div class="card click" onclick="go('queue')"><div class="k">Shorts queue</div>
    <div class="v">${days}<small> days</small></div>
    <div class="d ${days>3?'':'r'}">${D.queue.pending} clips ready</div></div>`;
  h+=`<div class="card click" onclick="go('cost')"><div class="k">Total spend</div>
    <div class="v">$${D.cost_total.toFixed(0)}</div>
    <div class="d">${D.costs.length} episodes &middot; tap to break down</div></div>`;
  h+=`</div>`;
  h+=`<div class="cols"><div><div class="panel"><h2>Views per day</h2>
    ${chart(D.daily)}<div class="legend">
    <span><i style="background:#3ddc84"></i>Quiet Chain</span>
    <span><i style="background:#ffb454"></i>Dead Trade</span></div></div>`;
  c.forEach(ch=>{
    h+=`<div class="panel"><div class="head" style="margin-bottom:9px">
      <div><b>${ch.name}</b> <span class="sub">${ch.handle}</span></div>
      <button class="back" onclick="go('yt','${ch.key}')">Open &rarr;</button></div>
      <div class="stack">
      <div><div class="k">Shorts</div><div class="v" style="font-size:19px">
        ${fmt(ch.short_views)}</div><div class="d">${ch.short_n} videos &middot; ${mins(ch.short_min)}</div></div>
      <div><div class="k">Long-form</div><div class="v" style="font-size:19px">
        ${fmt(ch.long_views)}</div><div class="d">${ch.long_n} videos &middot; ${mins(ch.long_min)}</div></div>
      <div><div class="k">Subscribers</div><div class="v" style="font-size:19px">
        ${ch.subs}</div><div class="d">of 1,000 for YPP</div></div>
      </div></div>`;});
  h+=`</div><div>${rail()}</div></div>`;
  return h;
}

function ytChannel(key){
  const ch=D.channels.find(x=>x.key===key); if(!ch) return ytHome();
  const yppMin=4000*60;
  let h=`<button class="back" onclick="go('yt')">&larr; All channels</button>
    <div class="head"><div><h1>${ch.name}</h1>
    <div class="sub">${ch.handle} &middot; ${ch.promise}</div></div>
    <div class="sub">Builds ${ch.build_day}</div></div>`;
  h+=`<div class="kpis">
    <div class="card"><div class="k">Shorts views</div><div class="v">${fmt(ch.short_views)}</div>
      <div class="d">${ch.short_n} videos &middot; ${mins(ch.short_min)} watched</div></div>
    <div class="card"><div class="k">Long-form views</div><div class="v">${fmt(ch.long_views)}</div>
      <div class="d">${ch.long_n} videos &middot; ${mins(ch.long_min)} watched</div></div>
    <div class="card"><div class="k">Subscribers</div>
      <div class="v">${ch.subs}<small> / 1,000</small></div>
      <div class="bar"><i style="width:${Math.min(100,ch.subs/10)}%"></i></div></div>
    <div class="card"><div class="k">YPP watch hours</div>
      <div class="v">${(ch.long_min/60).toFixed(1)}<small> / 4,000</small></div>
      <div class="bar"><i style="width:${Math.min(100,ch.long_min/yppMin*100).toFixed(2)}%"></i></div>
      <div class="d a">long-form only, est. 50% retention</div></div></div>`;
  h+=`<div class="cols"><div>`;
  ['short','long'].forEach(kind=>{
    const v=ch.videos.filter(x=>x.kind===kind); if(!v.length) return;
    h+=`<div class="panel"><h2>${kind==='short'?'Shorts':'Long-form'} (${v.length})</h2>
      <table><tr><th>Video</th><th class="num">Views</th><th class="num">Likes</th>
      <th class="num">Watch</th><th class="num">Age</th></tr>`;
    v.forEach(x=>{h+=`<tr class="click" onclick="window.open('https://youtu.be/${x.id}')">
      <td class="t">${x.title.slice(0,44)}</td><td class="num">${fmt(x.views)}</td>
      <td class="num">${x.likes}</td><td class="num">${mins(x.est_min)}</td>
      <td class="num">${Math.round(x.hours)}h</td></tr>`;});
    h+=`</table></div>`;});
  h+=`<div class="panel"><h2>Upcoming episodes</h2><table>`;
  ch.slate.forEach((s,i)=>{h+=`<tr><td class="num" style="width:26px;color:#87938c">
    ${i+1}</td><td class="t">${s}</td></tr>`;});
  h+=`</table></div></div><div>${rail(key, ch.name+' - next up')}</div></div>`;
  return h;
}

function costPage(){
  let h=`<button class="back" onclick="go('yt')">&larr; Back</button>
    <div class="head"><div><h1>Cost breakdown</h1>
    <div class="sub">Counted from files on disk, not estimated</div></div>
    <div class="sub">Total $${D.cost_total.toFixed(2)}</div></div>`;
  h+=`<div class="panel"><table>
    <tr><th>Episode</th><th class="num">Min</th><th class="num">Images</th>
    <th class="num">Art</th><th class="num">VO</th><th class="num">SFX</th>
    <th class="num">Anim</th><th class="num">Total</th><th class="num">$/min</th></tr>`;
  D.costs.forEach(c=>{h+=`<tr><td class="t">${c.episode}
    <span class="tag ${c.channel}">${c.channel.toUpperCase()}</span></td>
    <td class="num">${c.minutes}</td><td class="num">${c.images}</td>
    <td class="num">$${c.img_cost.toFixed(2)}</td>
    <td class="num">$${c.vo_cost.toFixed(2)}</td>
    <td class="num">$${c.sfx_cost.toFixed(2)}</td>
    <td class="num" style="color:#3ddc84">$0.00</td>
    <td class="num"><b>$${c.total.toFixed(2)}</b></td>
    <td class="num">$${(c.total/Math.max(c.minutes,.1)).toFixed(2)}</td></tr>`;});
  h+=`</table></div>
  <div class="panel"><h2>Unit rates</h2><table>
   <tr><td>Image (nano-banana-pro)</td><td class="num">$0.150 each</td></tr>
   <tr><td>Voice (ElevenLabs Liam)</td><td class="num">$0.100 / 1k chars</td></tr>
   <tr><td>Sound effects</td><td class="num">$0.002 / second</td></tr>
   <tr><td>Animation (ffmpeg sprites)</td><td class="num" style="color:#3ddc84">free</td></tr>
  </table><div class="sub" style="margin-top:9px">
  Sprite compositing replaced AI video at $0.125 per 5s beat. On a 60-shot
  episode that alone was $7.50.</div></div>`;
  return h;
}

function queuePage(){
  let h=`<button class="back" onclick="go('yt')">&larr; Back</button>
    <div class="head"><div><h1>Shorts queue</h1>
    <div class="sub">2 per day at 19:00 &middot; same clip in both framings</div></div>
    <div class="sub">${D.queue.pending} clips &middot; ${D.queue.days} days</div></div>`;
  // group crop+full pairs so one row = one day
  const days=[];
  for(let i=0;i<D.queue.items.length;i+=2) days.push(D.queue.items.slice(i,i+2));
  const now=new Date();
  h+=`<div class="panel"><h2>What goes out, in order</h2>`;
  days.forEach((pair,i)=>{
    const d=new Date(now); d.setDate(now.getDate()+(now.getHours()>=19?i+1:i));
    const c=pair[0]; if(!c) return;
    h+=`<div class="item"><div class="when">${d.toLocaleDateString('en-GB',
      {weekday:'short',day:'numeric'})}<br>19:00</div>
      <div class="what">${esc(c.title)}
      <span class="tag ${c.ch}">${c.ch.toUpperCase()}</span>
      ${pair.map(p=>`<span class="tag">${p.fmt}</span>`).join('')}</div></div>`;});
  return h+`</div>`;
}

function scriptsPage(){
  let h=`<button class="back" onclick="go('yt')">&larr; Back</button>
    <div class="head"><div><h1>Episode scripts</h1>
    <div class="sub">Read what was narrated, line by line</div></div></div>`;
  if(!D.scripts||!D.scripts.length)
    return h+`<div class="panel"><div class="sub">No scripts found.</div></div>`;
  h+=`<div class="panel">`;
  D.scripts.forEach(s=>{
    h+=`<details class="draft"><summary><b>${esc(s.title)}</b>
      <span class="tag ${s.ch}">${s.ch.toUpperCase()}</span>
      <span class="tag">${s.lines} lines</span>
      ${s.built?'<span class="tag">built</span>':'<span class="tag">not built</span>'}
      </summary><pre>${esc(s.body)}</pre></details>`;});
  return h+`</div>`;
}

function socialHome(){
  const s=D.social;
  let h=`<div class="head"><div><h1>Social</h1><div class="sub">
    LinkedIn + Instagram Mon/Wed/Fri/Sat &middot; Threads 2x daily</div></div></div>
    <div class="kpis">
    <div class="card"><div class="k">Carousels</div>
      <div class="v">${s.carousels.length}</div><div class="d">queued &middot; LinkedIn + IG</div></div>
    <div class="card"><div class="k">Threads</div>
      <div class="v">${s.threads.length}</div><div class="d">queued chains</div></div>
    <div class="card"><div class="k">Weekly cadence</div><div class="v">16<small> posts</small></div>
      <div class="d">3 LI + 3 IG + 10 TH</div></div>
    <div class="card"><div class="k">Queue ends</div>
      <div class="v" style="font-size:16px">${s.carousels.length?s.carousels[s.carousels.length-1].date:'-'}</div></div>
    </div><div class="cols"><div>`;
  h+=`<div class="panel"><h2>Carousels &middot; tap to read the full post</h2>`;
  s.carousels.forEach((x,i)=>{
    h+=`<details class="draft"><summary><span class="when">${x.date} ${x.day}</span>
      <b>${x.slug}</b>${x.cards?`<span class="tag">${x.cards} cards</span>`:''}${apBadge(x.raw_slug)}</summary>`;
    if(x.body) h+=`<div class="k" style="margin-top:9px">LinkedIn</div>
      <pre>${esc(x.body)}</pre>`;
    if(x.ig) h+=`<div class="k">Instagram caption</div><pre>${esc(x.ig)}</pre>`;
    if(!x.body&&!x.ig) h+=`<div class="sub">No copy written yet.</div>`;
    h+=apButtons(x.raw_slug);
    h+=`</details>`;});
  h+=`</div><div class="panel"><h2>Threads &middot; tap to read the chain</h2>`;
  s.threads.forEach(x=>{
    h+=`<details class="draft"><summary><span class="when">${x.date} ${x.time}</span>
      <b>${x.slug}</b>${x.chain.length?`<span class="tag">${x.chain.length} parts</span>`:''}${apBadge(x.raw_slug)}</summary>`;
    const parts = x.chain.length?x.chain:(x.text?[x.text]:[]);
    if(parts.length) h+=`<pre>${esc(parts.join('\n\n———\n\n'))}</pre>`;
    else h+=`<div class="sub">No text yet.</div>`;
    h+=apButtons(x.raw_slug);
    h+=`</details>`;});
  h+=`</div></div><div>${rail('social','Social - next up')}</div></div>`;
  return h;
}

function nav(){
  const n=[];
  n.push(`<button class="nav ${view.page==='yt'&&!view.ch?'on':''}"
    onclick="go('yt')">YouTube</button>`);
  D.channels.forEach(c=>n.push(`<button class="nav sub ${view.ch===c.key?'on':''}"
    onclick="go('yt','${c.key}')">${c.name}
    <span class="n">${fmt(c.short_views+c.long_views)}</span></button>`));
  n.push(`<div class="navlab">Social</div>`);
  n.push(`<button class="nav ${view.page==='social'?'on':''}"
    onclick="go('social')">All platforms</button>`);
  n.push(`<div class="navlab">Ops</div>`);
  n.push(`<button class="nav ${view.page==='queue'?'on':''}"
    onclick="go('queue')">Shorts queue <span class="n">${D.queue.days}d</span></button>`);
  n.push(`<button class="nav ${view.page==='scripts'?'on':''}"
    onclick="go('scripts')">Episode scripts
    <span class="n">${(D.scripts||[]).length}</span></button>`);
  n.push(`<button class="nav ${view.page==='cost'?'on':''}"
    onclick="go('cost')">Costs <span class="n">$${D.cost_total.toFixed(0)}</span></button>`);
  return n.join('');
}

function render(){
  $('#nav').innerHTML=nav();
  let h;
  if(view.page==='yt') h = view.ch?ytChannel(view.ch):ytHome();
  else if(view.page==='social') h = socialHome();
  else if(view.page==='cost') h = costPage();
  else if(view.page==='queue') h = queuePage();
  else if(view.page==='scripts') h = scriptsPage();
  $('#main').innerHTML = h + `<div class="foot">
    Updated ${D.generated.slice(0,16).replace('T',' ')} Brunei &middot;
    rebuilds 08:15, 13:15, 21:15.<br>
    Watch time is estimated at 50% retention until YouTube Analytics
    backfills (24-48h lag). No tokens are stored in this page.</div>`
    + askBox();
  window.scrollTo(0,0);
}

/* -------------------------------------------------------------- ASK BOX
   Type a change, it gets done on PC1 within ~5 minutes.

   This page is STATIC (GitHub Pages) - no server, no API key, and a browser
   cannot edit files on PC1. So the request is filed as a GitHub issue
   labelled from the dashboard; a cron job on PC1 polls every 5 minutes,
   carries out the change, rebuilds and pushes. The issue IS the transport.

   Deliberately NOT a chat that replies here: a static page has nothing to
   reply with. It is a request box with an honest wait, not a fake assistant. */
function askBox(){
  const q = sessionStorage.getItem('hq_lastask')||'';
  return `<div class="askwrap">
    <div class="askbar">
      <input id="askin" class="askin" placeholder="Ask for a change - e.g. rewrite the hook on stainless-tea-staining"
             onkeydown="if(event.key==='Enter')askSend()">
      <button class="askbtn" onclick="askSend()">Send</button>
    </div>
    <div class="asknote">${q?('last sent: '+esc(q)+' - picked up within 5 min')
      :'Runs on PC1 within 5 minutes. Nothing publishes - it edits drafts only.'}</div>
  </div>`;
}
function askSend(){
  const el=document.getElementById('askin');
  const t=(el.value||'').trim();
  if(!t) return;
  sessionStorage.setItem('hq_lastask',t);
  const ctx = view.page+(view.ch?'/'+view.ch:'');
  window.open(`https://github.com/${AP_REPO}/issues/new`
    +`?title=${encodeURIComponent('ask: '+t.slice(0,60))}`
    +`&labels=ask`
    +`&body=${encodeURIComponent(t+'\n\n---\npage: '+ctx)}`,'_blank');
  el.value='';
  render();
}
window.askSend=askSend;
function go(page,ch){ view={page,ch:ch||null};
  history.replaceState(null,'','#'+page+(ch?'/'+ch:'')); render(); }
window.go=go;
(function(){const m=(location.hash||'#yt').slice(1).split('/');
  view={page:m[0]||'yt',ch:m[1]||null}; render();})();
</script>
